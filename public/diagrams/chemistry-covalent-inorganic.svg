<circle data-owner="O1" data-electron="dot" data-kind="bond" data-edge="O1-H1" cx="244.000" cy="162.000" r="3.5" fill="#8c4c3f"/>
<path data-owner="H1" data-electron="cross" data-kind="bond" data-edge="O1-H1" d="M232.000 164.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
