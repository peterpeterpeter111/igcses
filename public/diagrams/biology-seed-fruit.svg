<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title description">
 <title id="title">Pollination, fertilisation and distinct developmental origins</title>
 <desc id="description">Original functional sequence: compatible pollen on the stigma forms a tube that reaches an ovule, then male and egg nuclei fuse. Three separate origin mappings follow: zygote to embryo, ovule to seed, and ovary usually to fruit. These are parallel developmental origins, not embryo to seed to fruit.</desc>
 <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#774c42"/></marker></defs>
 <rect width="1000" height="820" fill="#faf7ed"/>
 <g font-family="Arial, sans-serif" fill="#302c27">
  <text x="30" y="48" font-size="28" font-weight="bold">Keep transfer, fusion and origins distinct</text>
  <text x="30" y="83" font-size="18">Original functional chart · not an anatomical section or measured growth trace</text>
  <rect x="30" y="126" width="285" height="141" fill="#eee2d9" stroke="#ac8d79"/>
  <text x="49" y="164" font-size="23" font-weight="bold">Pollination</text>
  <text x="49" y="202" font-size="19">Pollen transferred</text>
  <text x="49" y="234" font-size="19">from anther to stigma</text>
  <path d="M317 197H345" stroke="#774c42" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="350" y="126" width="285" height="141" fill="#efe7d5" stroke="#9b8766"/>
  <text x="369" y="164" font-size="23" font-weight="bold">Pollen-tube growth</text>
  <text x="369" y="202" font-size="19">Compatible pollen → tube</text>
  <text x="369" y="234" font-size="19">through style to an ovule</text>
  <path d="M638 197H666" stroke="#774c42" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="670" y="126" width="300" height="141" fill="#e4e6d5" stroke="#8b9277"/>
  <text x="689" y="164" font-size="23" font-weight="bold">Fertilisation</text>
  <text x="689" y="202" font-size="19">Male + egg nuclei fuse</text>
  <text x="689" y="234" font-size="19">inside the ovule → zygote</text>
  <text x="30" y="322" font-size="23" font-weight="bold">Three developmental origins in the usual flower model</text>
  <rect x="30" y="358" width="285" height="96" fill="#eee2d9" stroke="#ac8d79"/>
  <text x="49" y="401" font-size="25" font-weight="bold">Zygote</text>
  <text x="49" y="432" font-size="19">Fertilised egg cell</text>
  <rect x="350" y="358" width="285" height="96" fill="#efe7d5" stroke="#9b8766"/>
  <text x="369" y="401" font-size="25" font-weight="bold">Ovule</text>
  <text x="369" y="432" font-size="19">Contained inside ovary</text>
  <rect x="670" y="358" width="300" height="96" fill="#e4e6d5" stroke="#8b9277"/>
  <text x="689" y="401" font-size="25" font-weight="bold">Ovary</text>
  <text x="689" y="432" font-size="19">Encloses ovules</text>
  <g fill="none" stroke="#774c42" stroke-width="3" marker-end="url(#arrow)">
   <path d="M172 455V511"/><path d="M492 455V511"/><path d="M820 455V511"/>
  </g>
  <rect x="30" y="526" width="285" height="120" fill="#eee2d9" stroke="#ac8d79"/>
  <text x="49" y="567" font-size="25" font-weight="bold">Embryo</text>
  <text x="49" y="603" font-size="19">Develops by cell division</text>
  <rect x="350" y="526" width="285" height="120" fill="#efe7d5" stroke="#9b8766"/>
  <text x="369" y="567" font-size="25" font-weight="bold">Seed</text>
  <text x="369" y="603" font-size="19">Includes embryo / reserves</text>
  <text x="369" y="632" font-size="19">and protective seed coat</text>
  <rect x="670" y="526" width="300" height="120" fill="#e4e6d5" stroke="#8b9277"/>
  <text x="689" y="567" font-size="25" font-weight="bold">Fruit (usually)</text>
  <text x="689" y="603" font-size="19">Can enclose / protect seeds</text>
  <text x="30" y="705" font-size="22" font-weight="bold">Parallel origins — not embryo → seed → fruit.</text>
  <text x="30" y="751" font-size="18">Some fruit develops without fertilisation; other floral tissues can contribute.</text>
  <text x="30" y="789" font-size="18">A grain arriving on a stigma alone does not prove successful gamete fusion.</text>
 </g>
</svg>
