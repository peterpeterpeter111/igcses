<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title description">
 <title id="title">Selection changes proportions before equal reproduction</title>
 <desc id="description">Original assumed counts. Before exposure: two resistant and eighteen susceptible, ten percent resistant. Unequal survival leaves two of each, fifty percent resistant. One equal division per survivor gives four of each, still fifty percent. Bars show proportions, not equal total populations.</desc>
 <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#774c42"/></marker></defs>
 <rect width="1000" height="820" fill="#faf7ed"/>
 <g font-family="Arial, sans-serif" fill="#302c27">
  <text x="35" y="49" font-size="28" font-weight="bold">Track the denominator at every stage</text>
  <text x="35" y="84" font-size="18">Original assumed population · one specified antibiotic · not culture results</text>
  <rect x="35" y="106" width="18" height="18" fill="#ac8151"/><text x="65" y="122" font-size="18">R = resistant</text>
  <rect x="240" y="106" width="18" height="18" fill="#a4aaa0"/><text x="270" y="122" font-size="18">S = susceptible</text>
  <text x="35" y="171" font-size="24" font-weight="bold">1. Before exposure</text>
  <text x="35" y="205" font-size="21">2 R + 18 S = 20 total</text><text x="650" y="205" font-size="23">2 / 20 = 10% R</text>
  <rect x="35" y="227" width="90" height="42" fill="#ac8151"/><rect x="125" y="227" width="810" height="42" fill="#a4aaa0"/>
  <path d="M85 279V347" stroke="#774c42" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="135" y="320" font-size="20">Assumed unequal survival: both R survive, 2 of 18 S survive.</text>
  <text x="35" y="394" font-size="24" font-weight="bold">2. Survivors after exposure</text>
  <text x="35" y="428" font-size="21">2 R + 2 S = 4 total</text><text x="650" y="428" font-size="23">2 / 4 = 50% R</text>
  <rect x="35" y="450" width="450" height="42" fill="#ac8151"/><rect x="485" y="450" width="450" height="42" fill="#a4aaa0"/>
  <path d="M85 502V570" stroke="#774c42" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="135" y="543" font-size="20">Later: each survivor divides once; categories remain inherited.</text>
  <text x="35" y="617" font-size="24" font-weight="bold">3. Descendants after equal division</text>
  <text x="35" y="651" font-size="21">4 R + 4 S = 8 total</text><text x="650" y="651" font-size="23">4 / 8 = 50% R</text>
  <rect x="35" y="673" width="450" height="42" fill="#ac8151"/><rect x="485" y="673" width="450" height="42" fill="#a4aaa0"/>
  <text x="35" y="764" font-size="21" font-weight="bold">All bars show proportions. Total populations differ: 20 → 4 → 8.</text>
  <text x="35" y="798" font-size="17">Real populations need evidence; these counts do not diagnose a resistance mechanism.</text>
 </g>
</svg>
