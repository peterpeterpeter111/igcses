<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" role="img" aria-labelledby="title desc">
  <title id="title">Qualitative current–voltage characteristics</title>
  <desc id="desc">Three graphs with current vertical and voltage horizontal: an ohmic resistor has a straight line, a filament lamp curve becomes flatter at larger voltage magnitudes, and a diode has very little reverse current with sharply rising forward current. No numerical scale.</desc>
  <rect width="840" height="280" fill="#fcfaf7"/>
  <g font-family="Georgia,serif" font-size="18" fill="#392528" text-anchor="middle">
    <text x="140" y="28">Ohmic resistor</text><text x="420" y="28">Filament lamp</text><text x="700" y="28">Diode</text>
  </g>
  <g fill="none" stroke="#786e6b" stroke-width="1.6">
    <path d="M30 155H250m-110 100V50 M310 155H530m-110 100V50 M590 155H810m-110 100V50"/>
    <path d="m244 151 6 4-6 4m-108-103 4-6 4 6 m380 95 6 4-6 4m-108-103 4-6 4 6 m380 95 6 4-6 4m-108-103 4-6 4 6"/>
  </g>
  <g fill="#51484a" font-family="Arial,sans-serif" font-size="16">
    <text x="144" y="47">I</text><text x="252" y="161">V</text><text x="126" y="175">0</text>
    <text x="424" y="47">I</text><text x="532" y="161">V</text><text x="406" y="175">0</text>
    <text x="704" y="47">I</text><text x="812" y="161">V</text><text x="686" y="175">0</text>
  </g>
  <g fill="none" stroke="#8e283a" stroke-width="3.5" stroke-linecap="round">
    <path d="M48 238L232 72"/>
    <path d="M328 232C385 223 395 206 420 155C445 104 455 87 512 78"/>
    <path d="M594 156L700 155C726 155 742 154 750 147C763 135 770 101 777 61"/>
  </g>
</svg>
