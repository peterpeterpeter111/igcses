<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img" aria-labelledby="title desc"><title id="title">Two neutral carbon isotopes</title><desc id="desc">Original school shell model. Carbon-12 has6protons,6neutrons and6electrons; carbon-14 has6protons,8neutrons and6electrons. Both show2electrons in the first shell and4in the second. Sizes/positions not to scale; circles are not actual orbital paths.</desc><rect width="600" height="390" fill="#faf6ed"/><g font-family="system-ui,sans-serif" fill="#312a26"><text x="24" y="35" font-size="23" font-weight="650">Two neutral carbon isotopes</text><text x="24" y="63" font-size="14">Original shell model · not to scale or actual trajectories</text><text x="157" y="97" text-anchor="middle" font-size="20" font-weight="600">Carbon-12</text><circle cx="157" cy="207" r="49" fill="none" stroke="#b89e84" stroke-width="1.5"/><circle cx="157" cy="207" r="90" fill="none" stroke="#b89e84" stroke-width="1.5"/><circle cx="157" cy="207" r="36" fill="#f1d9cd" stroke="#873c44" stroke-width="2"/><text x="157" y="203" text-anchor="middle" font-size="13">6 protons</text><text x="157" y="221" text-anchor="middle" font-size="13">6 neutrons</text><circle cx="108" cy="207" r="6" fill="#4b6270"/><circle cx="206" cy="207" r="6" fill="#4b6270"/><circle cx="67" cy="207" r="6" fill="#4b6270"/><circle cx="247" cy="207" r="6" fill="#4b6270"/><circle cx="157" cy="117" r="6" fill="#4b6270"/><circle cx="157" cy="297" r="6" fill="#4b6270"/><text x="157" y="327" text-anchor="middle" font-size="15">Z = 6 · A = 12 · electrons = 6</text><text x="443" y="97" text-anchor="middle" font-size="20" font-weight="600">Carbon-14</text><circle cx="443" cy="207" r="49" fill="none" stroke="#b89e84" stroke-width="1.5"/><circle cx="443" cy="207" r="90" fill="none" stroke="#b89e84" stroke-width="1.5"/><circle cx="443" cy="207" r="36" fill="#f1d9cd" stroke="#873c44" stroke-width="2"/><text x="443" y="203" text-anchor="middle" font-size="13">6 protons</text><text x="443" y="221" text-anchor="middle" font-size="13">8 neutrons</text><circle cx="394" cy="207" r="6" fill="#4b6270"/><circle cx="492" cy="207" r="6" fill="#4b6270"/><circle cx="353" cy="207" r="6" fill="#4b6270"/><circle cx="533" cy="207" r="6" fill="#4b6270"/><circle cx="443" cy="117" r="6" fill="#4b6270"/><circle cx="443" cy="297" r="6" fill="#4b6270"/><text x="443" y="327" text-anchor="middle" font-size="15">Z = 6 · A = 14 · electrons = 6</text><circle cx="31" cy="362" r="6" fill="#4b6270"/><text x="45" y="367" font-size="14">Electron symbols; shell counts are 2,4 for both atoms.</text></g></svg>
