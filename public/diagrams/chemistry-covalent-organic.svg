<path data-owner="H3" data-electron="cross" data-kind="bond" data-edge="C1-H3" d="M296.000 91.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<circle data-owner="C1" data-electron="dot" data-kind="bond" data-edge="C1-H4" cx="300.000" cy="185.000" r="3.5" fill="#8c4c3f"/>
<path data-owner="H4" data-electron="cross" data-kind="bond" data-edge="C1-H4" d="M296.000 191.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<text x="25" y="278" font-size="17">• C · × H atoms</text>
</g>
<g data-molecule="C2H6" transform="translate(0,400)"><path d="M20 0H580" stroke="#c5b7a9"/><text x="25" y="27" font-size="20" font-weight="700">Ethane · C₂H₆ · 14 electrons</text>
