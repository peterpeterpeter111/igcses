<text data-atom="H4" data-element="H" x="300" y="242" text-anchor="middle" font-size="23">H</text>
<circle data-owner="C1" data-electron="dot" data-kind="bond" data-edge="C1-H1" cx="250.000" cy="145.000" r="3.5" fill="#8c4c3f"/>
<path data-owner="H1" data-electron="cross" data-kind="bond" data-edge="C1-H1" d="M236.000 141.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
