<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1040" viewBox="0 0 600 1040" role="img" aria-labelledby="title desc"><title id="title">Original organic shared-electron models</title><desc id="desc">Each panel shows outer-electron pairs and an explicit original-atom key; layouts do not specify molecular shapes.</desc><rect width="600" height="1040" fill="#faf7ef"/><g font-family="Arial,sans-serif" fill="#352b25">
<text x="25" y="30" font-size="22" font-weight="700">Shared pairs and lone pairs</text>
<text x="25" y="57" font-size="17">Outer-electron bookkeeping, not molecular shapes.</text>
<g data-molecule="CH4" transform="translate(0,80)"><path d="M20 0H580" stroke="#c5b7a9"/><text x="25" y="27" font-size="20" font-weight="700">Methane · CH₄ · 8 electrons</text>
<text data-atom="C1" data-element="C" x="300" y="152" text-anchor="middle" font-size="23">C</text>
<text data-atom="H1" data-element="H" x="190" y="152" text-anchor="middle" font-size="23">H</text>
