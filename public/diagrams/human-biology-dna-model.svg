<title id="title">DNA structure: two coiled strands and a simplified opened segment</title><desc id="desc">Two sugar phosphate chains coil into a double helix. A simplified opened segment shows complementary A T and C G base pairs joined by hydrogen bonds, and identifies one nucleotide as phosphate, sugar and base.</desc>
