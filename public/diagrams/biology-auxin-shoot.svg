<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">Unequal shoot elongation creates a bend towards light</title>
<desc id="desc">Original conceptual shoot model, not measured anatomy. Light arrives from the left. In the usual shoot model auxin is greater on the shaded right side, whose cells elongate more. This forms the longer outside of the curve, bending the shoot left towards light. A separate pair of cell columns illustrates shorter lit-side and longer shaded-side cells; it is not a root model.</desc>
<defs><marker id="light" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#716638" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="700" fill="#fbf8f0"/>
<g font-family="system-ui, sans-serif" fill="#292524">
<text x="34" y="43" font-size="26" font-weight="650">A shoot bends towards light</text>
<text x="34" y="75" font-size="16" fill="#686158">Original conceptual model · unequal elongation, not measured growth or a root response</text>
<text x="65" y="197" font-size="20" font-weight="600" fill="#716638">Light from the left</text>
<g fill="none" stroke="#716638" stroke-width="2.5" marker-end="url(#light)"><path d="M75 239H325"/><path d="M75 280H350"/><path d="M75 321H373"/></g>
<path d="M495 505C495 398 479 322 385 247Q367 220 402 221C528 279 554 391 535 505Z" fill="#c5cba7" stroke="#57684c" stroke-width="3"/>
<path d="M516 505C520 395 497 320 401 236" fill="none" stroke="#718166" stroke-width="1.5" stroke-dasharray="5 5"/>
<g fill="#963d43"><circle cx="528" cy="458" r="5"/><circle cx="529" cy="419" r="5"/><circle cx="520" cy="380" r="5"/><circle cx="506" cy="343" r="5"/><circle cx="482" cy="309" r="5"/></g>
<g fill="none" stroke="#8b8175" stroke-width="1.5"><path d="M394 224V164H455"/><path d="M490 417H400V453H282"/><path d="M536 405H600V477H632"/></g>
<text x="466" y="170" font-size="18" font-weight="600">Growing tip</text>
<text x="74" y="456" font-size="18" font-weight="600">Lit side</text>
<text x="74" y="481" font-size="16">Less elongation in this model</text>
<text x="641" y="484" font-size="18" font-weight="600" fill="#963d43">Shaded side</text>
<text x="641" y="511" font-size="16">More auxin → more elongation</text>
<text x="641" y="538" font-size="16">Longer outside of the bend</text>
<text x="689" y="142" font-size="19" font-weight="600">Compare cell elongation</text>
<text x="724" y="193" font-size="17">Lit</text><text x="839" y="193" font-size="17">Shaded</text>
<g fill="#e4e7ce" stroke="#718166" stroke-width="2"><rect x="713" y="218" width="57" height="40"/><rect x="713" y="258" width="57" height="40"/><rect x="713" y="298" width="57" height="40"/></g>
<g fill="#dcc2b5" stroke="#963d43" stroke-width="2"><rect x="838" y="218" width="57" height="62"/><rect x="838" y="280" width="57" height="62"/><rect x="838" y="342" width="57" height="62"/></g>
<text x="689" y="433" font-size="15" fill="#686158">Illustrative sizes, not cell measurements</text>
<text x="50" y="584" font-size="19" font-weight="600">The side that grows more becomes the outside of the curve.</text>
<text x="50" y="617" font-size="17">Light left → shaded side right → greater right-side elongation → shoot bends left.</text>
<text x="50" y="656" font-size="16" fill="#686158">Auxin effects depend on tissue and concentration. Do not copy this shoot mechanism unchanged to roots.</text>
</g></svg>
