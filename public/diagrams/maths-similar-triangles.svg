<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc">
  <title id="title">Match the smaller and larger similar triangles</title>
  <desc id="desc">D lies on AB and E lies on AC, with DE parallel to BC. Triangle ADE is similar to ABC by AA. A pairs with A, D with B and E with C. AD is 4 centimetres, AB is 10 centimetres and BC is 15 centimetres.</desc>
  <rect width="600" height="440" fill="#faf6ed"/>
  <g font-family="Georgia, serif" fill="#302522">
    <text x="300" y="34" font-size="26" text-anchor="middle">A–D–E ↔ A–B–C</text>
    <path d="M300 75 L70 295 H530 Z" fill="none" stroke="#514238" stroke-width="3"/>
    <path d="M300 75 L208 163 H392 Z" fill="#8b343b" fill-opacity="0.09" stroke="#8b343b" stroke-width="3"/>
    <path d="M286 155 L298 163 L286 171 M286 287 L298 295 L286 303" fill="none" stroke="#8b343b" stroke-width="2.5"/>
    <text x="300" y="67" font-size="25" text-anchor="middle">A</text>
    <text x="190" y="164" font-size="25" text-anchor="end">D</text><text x="408" y="164" font-size="25">E</text>
    <text x="51" y="321" font-size="25">B</text><text x="536" y="321" font-size="25">C</text>
    <text x="110" y="105" font-size="25">AD = 4 cm</text><text x="17" y="200" font-size="25">AB = 10 cm</text>
    <text x="300" y="342" font-size="25" text-anchor="middle">BC = 15 cm</text>
    <text x="425" y="199" font-size="24">DE ∥ BC</text>
    <text x="300" y="391" font-size="25" text-anchor="middle">DE / BC = AD / AB</text>
    <text x="300" y="422" font-size="25" text-anchor="middle">DE = 6 cm</text>
  </g>
</svg>
