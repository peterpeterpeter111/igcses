<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Equal elevation and depression angles</title>
  <desc id="desc">A tower is 18 metres horizontally from a ground observation point. The line of sight makes 30 degrees with the ground and 30 degrees with a parallel horizontal through the top. The height is 18 tan 30 degrees, or 6 square root 3 metres.</desc>
  <rect width="900" height="480" fill="#faf6ed"/>
  <g font-family="Georgia, serif" fill="#302522">
    <text x="450" y="32" text-anchor="middle" font-size="24">Measure from the horizontal</text>
    <path d="M120 400 H750 M710 400 V88.231" fill="none" stroke="#514238" stroke-width="3"/>
    <path d="M170 400 L710 88.231" fill="none" stroke="#8b343b" stroke-width="3"/>
    <path d="M430 88.231 H775" fill="none" stroke="#857161" stroke-width="2" stroke-dasharray="7 6"/>
    <path d="M690 400 V380 H710" fill="none" stroke="#514238" stroke-width="2"/>
    <path d="M235 400 A65 65 0 0 0 226.292 367.5" fill="none" stroke="#9b7842" stroke-width="2.5"/>
    <path d="M655 88.231 A55 55 0 0 0 662.369 115.731" fill="none" stroke="#9b7842" stroke-width="2.5"/>
    <circle cx="170" cy="400" r="4" fill="#302522"/><circle cx="710" cy="88.231" r="4" fill="#302522"/>
    <text x="258" y="385" font-size="22">30°</text>
    <text x="615" y="116" font-size="22">30°</text>
    <text x="450" y="75" font-size="18">Horizontal at the top</text>
    <text x="150" y="430" font-size="20">Observer</text>
    <text x="430" y="430" font-size="22">18 m</text>
    <text x="735" y="243" font-size="22">h</text>
    <text x="715" y="67" font-size="20">Top</text>
    <text x="450" y="465" text-anchor="middle" font-size="21">h = 18 tan 30° = 6√3 m ≈ 10.4 m</text>
  </g>
</svg>
