<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" role="img" aria-labelledby="title desc"><title id="title">ADH water-conservation sequence</title><desc id="desc">Original ordered control sequence from water loss to concentrated blood, hypothalamic detection, posterior-pituitary ADH release, increased water reabsorption and reduced disturbance.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8c2635"/></marker></defs><rect width="960" height="820" fill="#f7f0e4"/><g font-family="Arial,sans-serif" fill="#2e2724"><text x="35" y="40" font-size="25">ADH: opposing a loss of water</text><text x="35" y="72" font-size="17">School control model; arrows show sequence, not anatomical distance.</text><rect x="75" y="110" width="810" height="90" fill="#eadfca" stroke="#8c2635"/><text x="95" y="143" font-size="23">Water loss without replacement</text><text x="95" y="175" font-size="19">Blood becomes more concentrated</text><path d="M480 203 V225" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="230" width="810" height="90" fill="#eadfca" stroke="#8c2635"/><text x="95" y="263" font-size="23">Hypothalamic osmoreceptors</text><text x="95" y="295" font-size="19">Detect the concentration change</text><path d="M480 323 V345" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="350" width="810" height="90" fill="#eadfca" stroke="#8c2635"/><text x="95" y="383" font-size="23">ADH release increases</text><text x="95" y="415" font-size="19">Made in hypothalamus; released by posterior pituitary</text><path d="M480 443 V465" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="470" width="810" height="90" fill="#eadfca" stroke="#8c2635"/><text x="95" y="503" font-size="23">Collecting-duct water permeability rises</text><text x="95" y="535" font-size="19">More water returns to blood by osmosis</text><path d="M480 563 V585" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="590" width="810" height="90" fill="#eadfca" stroke="#8c2635"/><text x="95" y="623" font-size="23">Smaller, more concentrated urine volume</text><text x="95" y="655" font-size="19">Water conservation reduces the original disturbance</text><text x="75" y="745" font-size="19">Opposite disturbance: dilution → less ADH → less water reabsorption.</text><text x="75" y="775" font-size="19">As balance returns, the corrective signal diminishes: negative feedback.</text></g></svg>
