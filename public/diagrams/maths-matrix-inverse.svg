<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" role="img" aria-labelledby="title desc">
<title id="title">Find and check a two by two inverse</title>
<desc id="desc">The matrix with rows four, one and two, one has determinant two. Exchange the diagonal entries and negate the other entries. Multiply the new matrix with rows one, minus one and minus two, four by one half to give the inverse. Multiplication by the original matrix gives the identity.</desc>
<rect width="600" height="510" fill="#fbf8ef"/>
<g font-family="Georgia,serif" fill="#302520" text-anchor="middle">
<text x="300" y="42" font-size="27">A 2 × 2 inverse, step by step</text>
<text x="126" y="95" font-size="27">A =</text>
<g fill="none" stroke="#6d5246" stroke-width="2.5"><path d="M205 67h-13v106h13M365 67h13v106h-13"/></g>
<text x="242" y="108" font-size="29">4</text><text x="328" y="108" font-size="29">1</text>
<text x="242" y="154" font-size="29">2</text><text x="328" y="154" font-size="29">1</text>
<text x="300" y="208" font-size="25">det(A) = 4 × 1 − 1 × 2 = 2</text>
<path d="M86 227h428" stroke="#d4bda7" stroke-width="1"/>
<text x="300" y="262" font-size="23">Exchange diagonal. Negate the others.</text>
<text x="88" y="334" font-size="27">A⁻¹ =</text>
<text x="157" y="315" font-size="25">1</text><path d="M140 325h34" stroke="#302520" stroke-width="2"/><text x="157" y="354" font-size="25">2</text>
<g fill="none" stroke="#802e39" stroke-width="2.5"><path d="M207 285h-13v93h13M355 285h13v93h-13"/></g>
<g font-size="27" fill="#802e39"><text x="242" y="319">1</text><text x="323" y="319">−1</text><text x="242" y="362">−2</text><text x="323" y="362">4</text></g>
<text x="411" y="334" font-size="27">=</text>
<g fill="none" stroke="#6d5246" stroke-width="2.5"><path d="M447 285h-12v93h12M566 285h12v93h-12"/></g>
<g font-size="25"><text x="467" y="319">½</text><text x="543" y="319">−½</text><text x="467" y="362">−1</text><text x="543" y="362">2</text></g>
<text x="300" y="416" font-size="23">The factor ½ multiplies every entry.</text>
<path d="M86 435h428" stroke="#d4bda7" stroke-width="1"/>
<text x="300" y="477" font-size="26">Check: AA⁻¹ = A⁻¹A = I₂</text>
</g>
</svg>
