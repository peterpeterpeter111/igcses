<text x="28" y="62" font-size="16">Two stages of the same supervised investigation</text>
<text x="30" y="108" font-size="19" font-weight="700">A · Heating stage</text>
<text x="337" y="108" font-size="19" font-weight="700">B · Cooled weighing</text>
