<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="title description">
 <title id="title">Lens states for near and distance focus</title>
 <desc id="description">Two original conceptual state panels: distance has relaxed ciliary muscle, taut suspensory ligaments, flatter lens and lower converging power. Near has contracted ciliary muscle, reduced ligament tension, rounder lens and greater converging power. Shapes compare relative lens thickness, not anatomical scale, ray paths or measured sizes.</desc>
 <rect width="1000" height="630" fill="#faf7ed"/>
 <g font-family="Arial, sans-serif" fill="#302c27">
  <text x="36" y="48" font-size="27" font-weight="bold">Accommodation changes lens shape</text>
  <text x="36" y="80" font-size="17">Original state comparison · not anatomy, ray tracing or measured dimensions</text>
  <rect x="36" y="112" width="442" height="405" fill="#e9eadc" stroke="#94977d"/>
  <rect x="522" y="112" width="442" height="405" fill="#f0e4dc" stroke="#ac8d79"/>
  <text x="60" y="150" font-size="24" font-weight="bold">Distant object</text>
  <text x="546" y="150" font-size="24" font-weight="bold">Near object</text>
  <text x="60" y="190" font-size="20">Ciliary muscle relaxed</text>
  <text x="546" y="190" font-size="20">Ciliary muscle contracted</text>
  <text x="60" y="224" font-size="19">Ligaments taut · higher tension</text>
  <text x="546" y="224" font-size="19">Ligament tension reduced</text>
  <ellipse cx="257" cy="340" rx="29" ry="86" fill="#c5d8d5" stroke="#536e68" stroke-width="3"/>
  <ellipse cx="743" cy="340" rx="66" ry="86" fill="#c5d8d5" stroke="#536e68" stroke-width="3"/>
  <text x="60" y="461" font-size="20" font-weight="bold">Thinner / flatter lens</text>
  <text x="546" y="461" font-size="20" font-weight="bold">Thicker / rounder lens</text>
  <text x="60" y="492" font-size="19">Less converging power</text>
  <text x="546" y="492" font-size="19">Greater converging power</text>
  <text x="36" y="559" font-size="20" font-weight="bold">Ligaments are passive fibres; they do not actively contract.</text>
  <text x="36" y="595" font-size="18">Both states aim to focus on the retina. Pupil brightness control is a separate iris response.</text>
 </g>
</svg>
