<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
<title id="title">A lower barrier with unchanged endpoints</title><desc id="desc">Original hypothetical exothermic reaction profile. Reactants 70, products 25, peaks 120 and 95 kJ per mole. Forward activation energies 50 and 25, overall delta H minus 45 on the same basis. Simplified single-barrier model.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#51463f" stroke-width="1.5"/></marker></defs>
<rect width="960" height="550" fill="#f7f0e4"/>
<g font-family="Georgia,serif" fill="#2e2724"><text x="36" y="42" font-size="25">The barrier changes. The endpoints stay.</text></g>
<g fill="none" stroke="#51463f" stroke-width="2"><path d="M88 443 V88 M88 443 H866" marker-end="url(#arrow)"/></g>
<g stroke="#bcb0a0" stroke-dasharray="5 6"><path d="M88 140 H525 M88 215 H525 M88 290 H866 M88 425 H866"/></g>
<g fill="none" stroke-width="4"><path d="M130 290 H205 C300 290 337 140 430 140 S560 425 700 425 H825" stroke="#8c2635"/><path d="M130 290 H205 C302 290 350 215 430 215 S566 425 700 425 H825" stroke="#947342" stroke-dasharray="10 6"/></g>
<g fill="none" stroke="#51463f" stroke-width="2" marker-end="url(#arrow)"><path d="M282 287 V143 M541 287 V218 M849 293 V422"/></g>
<g font-family="Arial,sans-serif" font-size="17" fill="#2e2724"><text x="30" y="145">120</text><text x="39" y="220">95</text><text x="39" y="295">70</text><text x="39" y="430">25</text><text x="36" y="80">Energy / kJ mol⁻¹</text><text x="131" y="322">Reactants</text><text x="710" y="407">Products</text><text x="294" y="183">Eₐ = 50</text><text x="551" y="254">Eₐ = 25</text><text x="748" y="360">ΔH = −45</text><text x="546" y="474">Reaction progress →</text><text x="36" y="515" font-size="16">Invented values; simplified pathways. Crimson: uncatalysed. Dashed amber: catalytic.</text></g>
