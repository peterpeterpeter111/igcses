<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" role="img"><title>Refraction through a parallel-sided glass block</title><desc>Incident angle 45 degrees and refracted angle 28.1 degrees, measured from normals. The emerging ray is parallel to the incident ray.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#842f3c"/></marker></defs><rect width="680" height="460" fill="#fffdf7"/><style>text{font-family:Georgia,serif;font-size:18px;fill:#292321}.ray{fill:none;stroke:#842f3c;stroke-width:2.5;marker-end:url(#arrow)}.normal{stroke:#817871;stroke-dasharray:5 5}</style><rect x="80" y="200" width="540" height="140" fill="#ece8de" stroke="#817871"/><text x="100" y="177">Air</text><text x="100" y="270">Glass: n = 1.50</text><text x="100" y="380">Air</text><path class="normal" d="M300 100V285"/><path class="normal" d="M374.83 290V440"/><path class="ray" d="M150 50L298 198"/><path class="ray" d="M300 200L373.83 338"/><path class="ray" d="M374.83 340L454.83 420"/><text x="220" y="130">45°</text><text x="321" y="258">28.1°</text><text x="315" y="107">Normal</text><text x="422" y="369">45°</text><text x="315" y="37">Arrows show light travel</text><path d="M300 150 A50 50 0 0 0 264.64 164.64 M300 250 A50 50 0 0 0 323.57 244.10 M374.83 385 A45 45 0 0 0 406.65 371.82" fill="none" stroke="#906e3b" stroke-width="1.5"/></svg>
