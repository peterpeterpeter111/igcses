<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" role="img" aria-labelledby="title desc"><title id="title">Invented solubility curve</title><desc id="desc">Original graph with temperature horizontally and grams of solute per100grams water vertically. Invented points:20°C24,40°C38,60°C58,80°C84. A smooth illustrative trend is drawn only between20and80°C; interpolated readings are estimates, not measured data.</desc><rect width="600" height="520" fill="#faf6ed"/><g font-family="system-ui,sans-serif" fill="#312a26"><text x="24" y="35" font-size="23" font-weight="650">An illustrative solubility trend</text><text x="24" y="64" font-size="14">Four invented data points · no actual trial</text><path d="M76 390V110" stroke="#dfd2bf"/><text x="76" y="415" text-anchor="middle" font-size="14">0</text><path d="M176 390V110" stroke="#dfd2bf"/><text x="176" y="415" text-anchor="middle" font-size="14">20</text><path d="M276 390V110" stroke="#dfd2bf"/><text x="276" y="415" text-anchor="middle" font-size="14">40</text><path d="M376 390V110" stroke="#dfd2bf"/><text x="376" y="415" text-anchor="middle" font-size="14">60</text><path d="M476 390V110" stroke="#dfd2bf"/><text x="476" y="415" text-anchor="middle" font-size="14">80</text><path d="M576 390V110" stroke="#dfd2bf"/><text x="576" y="415" text-anchor="middle" font-size="14">100</text><path d="M76 390H576" stroke="#dfd2bf"/><text x="65" y="395" text-anchor="end" font-size="14">0</text><path d="M76 334H576" stroke="#dfd2bf"/><text x="65" y="339" text-anchor="end" font-size="14">20</text><path d="M76 278H576" stroke="#dfd2bf"/><text x="65" y="283" text-anchor="end" font-size="14">40</text><path d="M76 222H576" stroke="#dfd2bf"/><text x="65" y="227" text-anchor="end" font-size="14">60</text><path d="M76 166H576" stroke="#dfd2bf"/><text x="65" y="171" text-anchor="end" font-size="14">80</text><path d="M76 110H576" stroke="#dfd2bf"/><text x="65" y="115" text-anchor="end" font-size="14">100</text><path d="M76 110V390H576" fill="none" stroke="#514239" stroke-width="2"/><text x="326" y="448" text-anchor="middle" font-size="16">Temperature / °C</text><text x="20" y="265" transform="rotate(-90 20 265)" text-anchor="middle" font-size="14">Solubility / g per 100 g water</text><path d="M176 322.8Q326 276.6 476 154.8" fill="none" stroke="#873c44" stroke-width="3"/><circle cx="176" cy="322.8" r="5" fill="#873c44"/><circle cx="276" cy="283.6" r="5" fill="#873c44"/><circle cx="376" cy="227.6" r="5" fill="#873c44"/><circle cx="476" cy="154.8" r="5" fill="#873c44"/><text x="24" y="503" font-size="14">Interpolation estimates within the range; extrapolation is unverified.</text></g></svg>
