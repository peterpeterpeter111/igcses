<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">Which fraction contains the wanted salt?</title>
  <desc id="desc">Three original salt-method comparisons. Insoluble base and acid: filter excess solid and keep the soluble-salt filtrate. Acid and alkali: find reacting volumes and repeat without indicator. Two soluble reagents for an insoluble salt: filter, keep and wash the precipitate residue. Appropriate crystallization or drying completes each route.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#943d45"/></marker></defs>
  <rect width="960" height="580" fill="#f7f1e7"/>
  <g fill="#332c27" font-family="Georgia, serif">
    <text x="34" y="43" font-size="28">Choose the route from solubility</text>
    <text x="35" y="96" font-size="22">Acid + insoluble base</text>
    <text x="347" y="96" font-size="22">Acid + alkali</text>
    <text x="662" y="96" font-size="22">Two soluble reagents</text>
  </g>
  <g fill="#625449" font-family="Arial, sans-serif" font-size="18">
    <text x="35" y="125">Wanted salt is soluble</text>
    <text x="347" y="125">Wanted salt is soluble</text>
    <text x="662" y="125">Wanted salt is insoluble</text>
  </g>
  <g stroke="#d1bfac" fill="#fdf9f0" stroke-width="2">
    <rect x="28" y="153" width="277" height="94"/><rect x="342" y="153" width="277" height="94"/><rect x="656" y="153" width="277" height="94"/>
    <rect x="28" y="296" width="277" height="96"/><rect x="342" y="296" width="277" height="96"/><rect x="656" y="296" width="277" height="96"/>
    <rect x="28" y="444" width="277" height="77"/><rect x="342" y="444" width="277" height="77"/><rect x="656" y="444" width="277" height="77"/>
  </g>
  <g stroke="#943d45" stroke-width="3" marker-end="url(#arrow)">
    <path d="M167 251v37"/><path d="M481 251v37"/><path d="M795 251v37"/>
    <path d="M167 397v39"/><path d="M481 397v39"/><path d="M795 397v39"/>
  </g>
  <g fill="#433830" font-family="Arial, sans-serif" font-size="20">
    <text x="45" y="183"><tspan x="45">React acid with</tspan><tspan x="45" dy="28">excess suitable</tspan><tspan x="45" dy="28">insoluble base.</tspan></text>
    <text x="359" y="183"><tspan x="359">Find reacting volumes</tspan><tspan x="359" dy="28">by titration.</tspan></text>
    <text x="673" y="183"><tspan x="673">Mix suitable solutions.</tspan><tspan x="673" dy="28">Precipitate forms.</tspan></text>
    <text x="45" y="329"><tspan x="45">Filter excess solid.</tspan><tspan x="45" dy="30" fill="#863841">KEEP FILTRATE</tspan></text>
    <text x="359" y="329"><tspan x="359">Repeat measured</tspan><tspan x="359" dy="28">amounts without</tspan><tspan x="359" dy="28">indicator.</tspan></text>
    <text x="673" y="326"><tspan x="673">Filter and wash solid.</tspan><tspan x="673" dy="30" fill="#863841">KEEP RESIDUE</tspan></text>
    <text x="45" y="474"><tspan x="45">Crystallize suitably;</tspan><tspan x="45" dy="28">separate and dry.</tspan></text>
    <text x="359" y="474"><tspan x="359">Crystallize suitably;</tspan><tspan x="359" dy="28">separate and dry.</tspan></text>
    <text x="673" y="474"><tspan x="673">Dry appropriately.</tspan><tspan x="673" dy="28">Check contamination.</tspan></text>
  </g>
  <text x="34" y="557" fill="#625449" font-family="Arial, sans-serif" font-size="17">Original method comparison. Solubility, hydration and impurities determine the appropriate isolation conditions.</text>
</svg>
