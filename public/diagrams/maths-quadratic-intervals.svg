<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
<title id="title">From roots to an interval</title>
<desc id="desc">The quadratic (x minus 3)(x plus 2) is positive outside minus 2 and 3 and negative inside. For less than or equal to zero, include the closed interval from minus 2 to 3.</desc>
<rect width="720" height="320" fill="#faf5ec"/>
<g font-family="Georgia, serif" fill="#302421">
<text x="360" y="30" text-anchor="middle" font-size="21">From roots to an interval</text>
<text x="360" y="66" text-anchor="middle" font-size="19">(x − 3)(x + 2) ≤ 0</text>
<path fill="none" d="M45 155H685" stroke="#302421" stroke-width="2"/>
<path fill="none" d="M45 155L54 151M45 155L54 159M685 155L676 151M685 155L676 159" stroke="#302421"/>
<path fill="none" d="M60.00 150V160" stroke="#302421"/>
<text x="60.00" y="181" text-anchor="middle" font-size="15">-4</text>
<path fill="none" d="M126.67 150V160" stroke="#302421"/>
<text x="126.67" y="181" text-anchor="middle" font-size="15">-3</text>
<path fill="none" d="M193.33 150V160" stroke="#302421"/>
<text x="193.33" y="181" text-anchor="middle" font-size="15">-2</text>
<path fill="none" d="M260.00 150V160" stroke="#302421"/>
<text x="260.00" y="181" text-anchor="middle" font-size="15">-1</text>
<path fill="none" d="M326.67 150V160" stroke="#302421"/>
<text x="326.67" y="181" text-anchor="middle" font-size="15">0</text>
<path fill="none" d="M393.33 150V160" stroke="#302421"/>
<text x="393.33" y="181" text-anchor="middle" font-size="15">1</text>
<path fill="none" d="M460.00 150V160" stroke="#302421"/>
<text x="460.00" y="181" text-anchor="middle" font-size="15">2</text>
<path fill="none" d="M526.67 150V160" stroke="#302421"/>
<text x="526.67" y="181" text-anchor="middle" font-size="15">3</text>
<path fill="none" d="M593.33 150V160" stroke="#302421"/>
<text x="593.33" y="181" text-anchor="middle" font-size="15">4</text>
<path fill="none" d="M660.00 150V160" stroke="#302421"/>
<text x="660.00" y="181" text-anchor="middle" font-size="15">5</text>
<text x="126.67" y="120" text-anchor="middle" font-size="17">positive</text>
<text x="360.00" y="120" text-anchor="middle" font-size="17">negative</text>
<text x="593.33" y="120" text-anchor="middle" font-size="17">positive</text>
<path fill="none" d="M193.33 155H526.67" stroke="#912f3e" stroke-width="6"/>
<circle cx="193.33" cy="155" r="6" fill="#912f3e"/>
<circle cx="526.67" cy="155" r="6" fill="#912f3e"/>
<text x="360" y="232" text-anchor="middle" font-size="22" fill="#912f3e">−2 ≤ x ≤ 3</text>
<text x="360" y="272" text-anchor="middle" font-size="15">Filled endpoints: zero is allowed by ≤</text>
</g></svg>
