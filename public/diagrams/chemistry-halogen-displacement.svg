<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 486" role="img" aria-labelledby="title description">
  <title id="title">Predicted halogen displacement outcomes</title>
  <desc id="description">Chlorine displaces bromide to form bromine and iodide to form iodine. Bromine displaces iodide to form iodine. Other cells show no net displacement. These are predicted aqueous outcomes, not experimental results.</desc>
  <rect width="800" height="486" fill="#f6f1e7"/>
  <g font-family="Arial, sans-serif" fill="#292322">
    <text x="32" y="40" font-size="28" font-weight="700">Which halogen is displaced?</text>
    <text x="32" y="70" font-size="19">Predictions for chlorine, bromine and iodine</text>
    <text x="510" y="110" text-anchor="middle" font-size="19">Halide ion already in the solution</text>
    <g text-anchor="middle" font-size="22" font-weight="700">
      <text x="350" y="145">Cl⁻</text><text x="510" y="145">Br⁻</text><text x="670" y="145">I⁻</text>
    </g>
    <text x="32" y="145" font-size="19">Added halogen</text>
    <g font-size="22" font-weight="700">
      <text x="32" y="213">Chlorine · Cl₂</text>
      <text x="32" y="293">Bromine · Br₂</text>
      <text x="32" y="373">Iodine · I₂</text>
    </g>
    <g stroke="#b9ab99" stroke-width="1.5" fill="#e8e1d5">
      <rect x="275" y="170" width="150" height="70"/>
      <rect x="275" y="250" width="150" height="70"/>
      <rect x="435" y="250" width="150" height="70"/>
      <rect x="275" y="330" width="150" height="70"/>
      <rect x="435" y="330" width="150" height="70"/>
      <rect x="595" y="330" width="150" height="70"/>
    </g>
    <g stroke="#8b4943" stroke-width="1.5" fill="#ead1c8">
      <rect x="435" y="170" width="150" height="70"/>
      <rect x="595" y="170" width="150" height="70"/>
      <rect x="595" y="250" width="150" height="70"/>
    </g>
    <g text-anchor="middle" font-size="19">
      <text x="350" y="200">No<tspan x="350" dy="25">displacement</tspan></text>
      <text x="350" y="280">No<tspan x="350" dy="25">displacement</tspan></text>
      <text x="510" y="280">No<tspan x="510" dy="25">displacement</tspan></text>
      <text x="350" y="360">No<tspan x="350" dy="25">displacement</tspan></text>
      <text x="510" y="360">No<tspan x="510" dy="25">displacement</tspan></text>
      <text x="670" y="360">No<tspan x="670" dy="25">displacement</tspan></text>
    </g>
    <g text-anchor="middle" fill="#71312d" font-size="22" font-weight="700">
      <text x="510" y="200">Br₂<tspan x="510" dy="25">formed</tspan></text>
      <text x="670" y="200">I₂<tspan x="670" dy="25">formed</tspan></text>
      <text x="670" y="280">I₂<tspan x="670" dy="25">formed</tspan></text>
    </g>
    <text x="32" y="438" font-size="22">Example: Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂</text>
    <text x="32" y="469" font-size="18">No displacement does not mean the mixture must be colourless.</text>
  </g>
</svg>
