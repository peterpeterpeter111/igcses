<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-labelledby="title desc">
<title id="title">Linear force-extension example</title><desc id="desc">Force against extension is a straight line through the origin, with 2 newtons at 1 centimetre, 4 newtons at 2 centimetres and 6 newtons at 3 centimetres. The stiffness is 200 newtons per metre. These are illustrative data for a spring within its proportional range.</desc>
<rect width="600" height="350" fill="#fffdf7"/><g font-family="Arial,sans-serif" font-size="16" fill="#252621">
<text x="68" y="30">Force / N</text><text x="303" y="337" text-anchor="middle">Extension / cm</text>
<path d="M68 284 H538 M68 211 H538 M68 137 H538 M68 64 H538 M225 64 V284 M381 64 V284 M538 64 V284" fill="none" stroke="#e2ddd4"/>
<path d="M68 54 V284 H550" fill="none" stroke="#252621" stroke-width="2"/>
<path d="M68 284 L538 64" fill="none" stroke="#7b2e35" stroke-width="3"/>
<text x="55" y="289" text-anchor="end">0</text><text x="55" y="216" text-anchor="end">2</text><text x="55" y="142" text-anchor="end">4</text><text x="55" y="69" text-anchor="end">6</text>
<text x="68" y="308" text-anchor="middle">0</text><text x="225" y="308" text-anchor="middle">1</text><text x="381" y="308" text-anchor="middle">2</text><text x="538" y="308" text-anchor="middle">3</text>
</g></svg>
