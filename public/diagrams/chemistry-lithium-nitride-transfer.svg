<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc"><title id="title">Electron transfer · Li₃N</title><desc id="desc">Original outer-electron formation model for Li3N; electron counts and product charges balance.</desc><rect width="600" height="500" rx="8" fill="#faf7ef" /><g font-family="Arial,sans-serif" fill="#352b25">
<text x="25" y="35" font-size="22" font-weight="700">Electron transfer · Li₃N</text>
<text x="25" y="65" font-size="17">× from metal · ● from non-metal · inner shells omitted</text>
<text x="25" y="99" font-size="18" font-weight="700">Before · neutral atoms</text>
<g data-kind="neutral-metal" data-dots="0" data-crosses="1" transform="translate(-5,0)"><text x="75" y="172" text-anchor="middle" font-size="24">Li</text>
<path data-electron="cross" d="M64 131l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2" />
</g>
<g data-kind="neutral-metal" data-dots="0" data-crosses="1" transform="translate(15,0)"><text x="165" y="172" text-anchor="middle" font-size="24">Li</text>
<path data-electron="cross" d="M154 131l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2" />
</g>
<g data-kind="neutral-metal" data-dots="0" data-crosses="1" transform="translate(35,0)"><text x="255" y="172" text-anchor="middle" font-size="24">Li</text>
<path data-electron="cross" d="M244 131l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2" />
</g>
<g data-kind="neutral-nonmetal" data-dots="5" data-crosses="0"><text x="475" y="172" text-anchor="middle" font-size="24">N</text>
<circle data-electron="dot" cx="468.0" cy="135.0" r="3.5" fill="#8c4c3f" />
<circle data-electron="dot" cx="482.0" cy="135.0" r="3.5" fill="#8c4c3f" />
<circle data-electron="dot" cx="505.0" cy="158.0" r="3.5" fill="#8c4c3f" />
<circle data-electron="dot" cx="468.0" cy="195.0" r="3.5" fill="#8c4c3f" />
<circle data-electron="dot" cx="445.0" cy="158.0" r="3.5" fill="#8c4c3f" />
</g>
<path d="M292 233v38m-9 -10l9 10 9 -10" stroke="#8c4c3f" stroke-width="3" fill="none" /><text x="25" y="250" font-size="17">Transfer 3 electrons</text>
<text x="25" y="302" font-size="18" font-weight="700">After · separate ion brackets</text>
<g data-kind="positive-ion" data-dots="0" data-crosses="0" transform="translate(-5,0)"><text x="75" y="372" text-anchor="middle" font-size="24">Li</text>
<path d="M36 323h-5v84h5M114 323h5v84h-5" stroke="#574333" stroke-width="2" fill="none" /><text x="118" y="319" font-size="18">+</text>
</g>
<g data-kind="positive-ion" data-dots="0" data-crosses="0" transform="translate(15,0)"><text x="165" y="372" text-anchor="middle" font-size="24">Li</text>
<path d="M126 323h-5v84h5M204 323h5v84h-5" stroke="#574333" stroke-width="2" fill="none" /><text x="208" y="319" font-size="18">+</text>
</g>
<g data-kind="positive-ion" data-dots="0" data-crosses="0" transform="translate(35,0)"><text x="255" y="372" text-anchor="middle" font-size="24">Li</text>
<path d="M216 323h-5v84h5M294 323h5v84h-5" stroke="#574333" stroke-width="2" fill="none" /><text x="298" y="319" font-size="18">+</text>
</g>
<g data-kind="negative-ion" data-dots="5" data-crosses="3"><text x="475" y="372" text-anchor="middle" font-size="24">N</text>
<circle data-electron="dot" cx="468.0" cy="335.0" r="3.5" fill="#8c4c3f" />
<circle data-electron="dot" cx="482.0" cy="335.0" r="3.5" fill="#8c4c3f" />
<circle data-electron="dot" cx="505.0" cy="358.0" r="3.5" fill="#8c4c3f" />
<circle data-electron="dot" cx="468.0" cy="395.0" r="3.5" fill="#8c4c3f" />
<circle data-electron="dot" cx="445.0" cy="358.0" r="3.5" fill="#8c4c3f" />
<path data-electron="cross" d="M501.0 368.0l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2" />
<path data-electron="cross" d="M478.0 391.0l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2" />
<path data-electron="cross" d="M441.0 368.0l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2" />
<path d="M436 323h-5v84h5M514 323h5v84h-5" stroke="#574333" stroke-width="2" fill="none" /><text x="518" y="319" font-size="18">3−</text>
