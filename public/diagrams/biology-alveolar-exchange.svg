<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
<title id="title">Alveolar gas exchange: separate air and blood routes</title>
<desc id="desc">Original enlarged functional schematic. Alveolar air above a thin alveolar lining and capillary wall is separate from flowing blood below. Oxygen diffuses down into blood, while carbon dioxide diffuses upwards into alveolar air. Arrows represent net transfer; barrier cells and distances are not drawn to scale.</desc>
<defs><marker id="oxygen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#963d43" stroke-width="1.5"/></marker><marker id="co2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#716638" stroke-width="1.5"/></marker></defs>
<rect width="980" height="620" fill="#fbf8f0"/>
<g font-family="system-ui, sans-serif" fill="#292524">
<text x="34" y="43" font-size="26" font-weight="650">An alveolus: area, distance and gradients</text>
<text x="34" y="75" font-size="16" fill="#686158">Original functional model · enlarged, not to scale · net diffusion arrows</text>
<rect x="40" y="110" width="594" height="152" fill="#f0e9dc"/>
<text x="60" y="145" font-size="22" font-weight="600">Alveolar air</text>
<text x="60" y="173" font-size="16">Ventilation renews the gases in this air space.</text>
<path d="M40 264H634V285H40Z" fill="#c6b49c" stroke="#5a453c" stroke-width="1.5"/>
<path d="M40 303H634V324H40Z" fill="#dcc2b5" stroke="#5a453c" stroke-width="1.5"/>
<rect x="40" y="326" width="594" height="133" fill="#f0dfda"/>
<text x="60" y="430" font-size="21" font-weight="600">Capillary blood — a separate pathway</text>
<path d="M80 384H572" stroke="#963d43" stroke-width="3" marker-end="url(#oxygen)"/>
<text x="90" y="367" font-size="16">Blood flow carries gases onwards.</text>
<path d="M267 199V349" stroke="#963d43" stroke-width="4" marker-end="url(#oxygen)"/>
<path d="M453 347V200" stroke="#716638" stroke-width="4" marker-end="url(#co2)"/>
<text x="200" y="224" font-size="19" font-weight="600" fill="#963d43">O₂</text>
<text x="474" y="224" font-size="19" font-weight="600" fill="#716638">CO₂</text>
<g stroke="#8b8175" stroke-width="1.5" fill="none"><path d="M637 274H674V225H697"/><path d="M637 315H674V341H697"/></g>
<text x="710" y="217" font-size="18" font-weight="600">Alveolar lining</text>
<text x="710" y="240" font-size="15">Thin and moist;</text><text x="710" y="261" font-size="15">gases dissolve at the surface.</text>
<text x="710" y="333" font-size="18" font-weight="600">Capillary wall</text>
<text x="710" y="357" font-size="15">A short diffusion distance</text><text x="710" y="378" font-size="15">separates air and blood.</text>
<text x="40" y="500" font-size="18" font-weight="600">Each gas follows its own partial-pressure gradient.</text>
<text x="40" y="532" font-size="16">Oxygen: alveolar air → incoming blood. Carbon dioxide: blood → alveolar air.</text>
<text x="40" y="560" font-size="16">Many alveoli provide a large total surface; ventilation and blood flow maintain gradients.</text>
<text x="40" y="590" font-size="15" fill="#686158">This model omits detailed cell shapes and shared basement layers. Air does not enter the blood vessel.</text>
</g></svg>
