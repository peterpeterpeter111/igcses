<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">A many-to-one function</title>
  <desc id="desc">For input set minus two, zero and two, the rule x squared sends minus two and two to four and zero to zero. Each input has one output. Reversing the arrows would give four two outputs.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8d2634"/></marker></defs>
  <rect width="900" height="430" fill="#faf6ee"/>
  <g font-family="Georgia,serif" fill="#302523">
    <text x="55" y="42" font-size="24">A function can send two inputs to one output</text>
    <text x="215" y="88" text-anchor="middle" font-size="19">Domain {−2, 0, 2}</text>
    <text x="680" y="88" text-anchor="middle" font-size="19">Range {0, 4}</text>
    <rect x="120" y="106" width="190" height="236" rx="6" fill="#eee7db" stroke="#bdab93"/>
    <rect x="585" y="106" width="190" height="236" rx="6" fill="#eee7db" stroke="#bdab93"/>
    <text x="215" y="158" text-anchor="middle" font-size="24">−2</text>
    <text x="215" y="235" text-anchor="middle" font-size="24">0</text>
    <text x="215" y="312" text-anchor="middle" font-size="24">2</text>
    <text x="680" y="189" text-anchor="middle" font-size="24">4</text>
    <text x="680" y="280" text-anchor="middle" font-size="24">0</text>
    <path d="M258 151Q448 112 646 181M258 305Q444 216 646 185M258 229Q448 287 646 272" fill="none" stroke="#8d2634" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="447" y="335" text-anchor="middle" font-size="22">f(x) = x²</text>
    <text x="450" y="382" text-anchor="middle" font-size="17">One arrow leaves each input. The output 4 is reached twice.</text>
    <text x="450" y="408" text-anchor="middle" font-size="17">An inverse needs a domain restriction to undo this mapping uniquely.</text>
  </g>
</svg>
