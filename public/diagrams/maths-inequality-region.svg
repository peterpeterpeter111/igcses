<path fill="none" d="M80 392H620" stroke="#912f3e" stroke-width="2"/>
<path fill="none" d="M80 132L530 392" stroke="#8b631a" stroke-width="3" stroke-dasharray="7 5"/>
<circle cx="170" cy="392" r="5" fill="#912f3e"/>
