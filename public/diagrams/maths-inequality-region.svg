<path fill="none" d="M80 288H620" stroke="#dfd4c3"/>
<text x="68" y="293" text-anchor="end" font-size="14">2</text>
<path fill="none" d="M80 236H620" stroke="#dfd4c3"/>
<text x="68" y="241" text-anchor="end" font-size="14">3</text>
<path fill="none" d="M80 184H620" stroke="#dfd4c3"/>
<text x="68" y="189" text-anchor="end" font-size="14">4</text>
