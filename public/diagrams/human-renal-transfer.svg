<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 745" role="img" aria-labelledby="title desc"><title id="title">Renal blood and filtrate routes</title><desc id="desc">Original schematic distinguishing blood retaining cells/proteins, initial small-solute filtrate, selective reabsorption to blood, and final urine route.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8c2635"/></marker></defs><rect width="960" height="745" fill="#f7f0e4"/><g font-family="Arial,sans-serif" fill="#2e2724"><text x="35" y="40" font-size="25">Renal processing: blood and tubular-fluid routes</text><text x="35" y="72" font-size="17">Schematic flow, not anatomical position or scale.</text><rect x="40" y="115" width="300" height="90" fill="#eadfca" stroke="#8c2635"/><text x="54" y="147" font-size="21">Renal artery blood</text><text x="54" y="180" font-size="16">Water, small solutes, cells, proteins</text><rect x="560" y="115" width="340" height="90" fill="#eadfca" stroke="#8c2635"/><text x="574" y="147" font-size="21">Glomerular blood</text><text x="574" y="180" font-size="16">Cells / large proteins retained</text><rect x="560" y="550" width="340" height="90" fill="#eadfca" stroke="#8c2635"/><text x="574" y="582" font-size="21">Renal vein blood</text><text x="574" y="615" font-size="16">Returns to the circulation</text><rect x="40" y="280" width="300" height="90" fill="#eadfca" stroke="#8c2635"/><text x="54" y="312" font-size="21">Initial filtrate in capsule</text><text x="54" y="345" font-size="16">Water, glucose, urea and ions</text><rect x="40" y="445" width="300" height="90" fill="#eadfca" stroke="#8c2635"/><text x="54" y="477" font-size="21">Tubule / collecting duct</text><text x="54" y="510" font-size="16">Selective return to nearby blood</text><rect x="40" y="610" width="300" height="90" fill="#eadfca" stroke="#8c2635"/><text x="54" y="642" font-size="21">Urine to renal pelvis</text><text x="54" y="675" font-size="16">Then ureter → bladder → urethra</text><path d="M345 160 H555" stroke="#8c2635" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M600 210 V240 H190 V274" stroke="#8c2635" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M190 375 V439" stroke="#8c2635" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M190 540 V604" stroke="#8c2635" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M850 210 V544" stroke="#8c2635" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="55" y="250" font-size="17">Filtration</text><path d="M345 490 H555 V595" stroke="#8c2635" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="375" y="425" font-size="17">Reabsorption returns</text><text x="375" y="452" font-size="17">useful solutes and water</text><text x="375" y="479" font-size="17">to surrounding blood.</text><text x="555" y="310" font-size="17">Blood and urine stay</text><text x="555" y="337" font-size="17">in different compartments.</text></g></svg>
