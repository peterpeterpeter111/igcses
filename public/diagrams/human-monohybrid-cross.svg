<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">A monohybrid cross: Bb × Bb</title>
  <desc id="desc">Each parent produces B and b gametes equally. The four boxes are BB, Bb, bB and bb. Genotypes are one BB to two Bb to one bb; B is completely dominant.</desc>
  <rect width="800" height="620" fill="#f5efe4"/>
  <g font-family="Georgia, serif" fill="#30241f">
    <text x="45" y="53" font-size="30">One allele from each parent</text>
    <text x="45" y="88" font-size="19">Bb × Bb · a stated model with complete dominance</text>
    <text x="450" y="136" text-anchor="middle" font-size="19">Gametes from one parent</text>
    <text x="350" y="181" text-anchor="middle" font-size="29" fill="#802f36">B</text>
    <text x="550" y="181" text-anchor="middle" font-size="29" fill="#802f36">b</text>
    <text x="48" y="262" font-size="18">Other</text>
    <text x="48" y="286" font-size="18">parent’s</text>
    <text x="48" y="310" font-size="18">gametes</text>
    <text x="197" y="284" text-anchor="middle" font-size="29" fill="#802f36">B</text>
    <text x="197" y="424" text-anchor="middle" font-size="29" fill="#802f36">b</text>
  </g>
  <rect x="250" y="210" width="400" height="280" fill="#eee3d0" stroke="#795e42" stroke-width="2"/>
  <rect x="450" y="350" width="200" height="140" fill="#e3c8bf"/>
  <path d="M450 210V490M250 350H650" stroke="#795e42" stroke-width="2"/>
  <g font-family="Georgia, serif" font-size="43" text-anchor="middle" fill="#30241f">
    <text x="350" y="286">BB</text><text x="550" y="286">Bb</text>
    <text x="350" y="426">bB</text><text x="550" y="426" fill="#802f36">bb</text>
  </g>
  <g font-family="Georgia, serif" font-size="19" text-anchor="middle" fill="#534039">
    <text x="350" y="318">¼</text><text x="550" y="318">¼</text>
    <text x="350" y="458">¼</text><text x="550" y="458">¼</text>
    <text x="400" y="538">Bb and bB are the same heterozygous genotype.</text>
    <text x="400" y="571">Genotypes 1 : 2 : 1 · phenotypes 3 dominant : 1 recessive</text>
    <text x="400" y="602" font-size="16">Probabilities for each fertilisation; not a guaranteed family of four.</text>
  </g>
</svg>
