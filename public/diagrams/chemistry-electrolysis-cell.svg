<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" role="img" aria-labelledby="title desc">
<title id="title">An ideal aqueous copper sulfate cell</title>
<desc id="desc">Separate conducting electrodes contact the solution. The left cathode connects to the negative supply terminal; the right anode connects to the positive terminal. Copper deposition and anode gas are predictions, not measured results.</desc>
<rect width="800" height="570" fill="#faf7ef"/>
<g font-family="Arial,sans-serif" fill="#352b25">
<text x="30" y="35" font-size="25" font-weight="700">Trace the supply connections</text>
<rect x="300" y="65" width="200" height="65" rx="3" fill="#ede4d5" stroke="#726354" stroke-width="2"/>
<text x="400" y="92" text-anchor="middle" font-size="18">Low-voltage DC supply</text>
<text id="negative-terminal" x="320" y="122" text-anchor="middle" font-size="23">−</text>
<text id="positive-terminal" x="480" y="122" text-anchor="middle" font-size="23">+</text>
<path id="cathode-wire" d="M320 130V165H220V220" fill="none" stroke="#665342" stroke-width="3"/>
<path id="anode-wire" d="M480 130V165H580V220" fill="none" stroke="#665342" stroke-width="3"/>
<path d="M170 250V460H630V250" fill="none" stroke="#665342" stroke-width="3"/>
<rect x="172" y="290" width="456" height="168" fill="#dce7e4"/>
<path d="M172 290H628" stroke="#83968f" stroke-width="2"/>
<rect id="cathode" x="214" y="220" width="12" height="190" fill="#756d64"/>
<rect id="anode" x="574" y="220" width="12" height="190" fill="#756d64"/>
<path d="M209 345V410H230V345" fill="none" stroke="#9c6246" stroke-width="5"/>
<circle cx="596" cy="345" r="5" fill="none" stroke="#83968f" stroke-width="2"/>
<circle cx="592" cy="323" r="4" fill="none" stroke="#83968f" stroke-width="2"/>
<circle cx="599" cy="305" r="3" fill="none" stroke="#83968f" stroke-width="2"/>
<text x="220" y="150" text-anchor="middle" font-size="19">Negative cathode</text>
<text x="580" y="150" text-anchor="middle" font-size="19">Positive anode</text>
<text x="400" y="330" text-anchor="middle" font-size="21">Aqueous CuSO₄</text>
<text x="400" y="363" text-anchor="middle" font-size="17">Mobile ions carry charge</text>
<text x="220" y="488" text-anchor="middle" font-size="18">Copper predicted</text>
<text x="580" y="488" text-anchor="middle" font-size="18">Anode gas predicted</text>
<text x="400" y="525" text-anchor="middle" font-size="17">Suitable inert electrodes · separate product identification</text>
<text x="400" y="551" text-anchor="middle" font-size="16">Original schematic: no observations or gas tests performed here.</text>
</g></svg>
