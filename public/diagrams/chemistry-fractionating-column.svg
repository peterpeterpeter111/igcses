<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Crude oil separates by boiling behaviour</title><desc id="desc">Original schematic relative outlet order: refinery gases, gasoline, kerosene, diesel, fuel oil and bitumen. The column is cooler at the top and hotter at the bottom. Each fraction is still a mixture, not one compound.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#8c2635" stroke-width="1.5"/></marker></defs>
<rect width="960" height="640" fill="#f7f0e4"/>
<text x="30" y="40" font-family="Georgia,serif" font-size="25" fill="#2e2724">Separate a mixture. Keep its molecules.</text>
<g fill="#ede0cc"><rect x="230" y="95" width="200" height="75"/><rect x="230" y="170" width="200" height="75" fill="#e5d3b9"/><rect x="230" y="245" width="200" height="75" fill="#d8baa0"/><rect x="230" y="320" width="200" height="75" fill="#c99e87"/><rect x="230" y="395" width="200" height="75" fill="#b7796c"/><rect x="230" y="470" width="200" height="75" fill="#9d5050"/></g>
<g fill="none" stroke="#51463f" stroke-width="2"><rect x="230" y="95" width="200" height="450"/><path d="M230 170 H430 M230 245 H430 M230 320 H430 M230 395 H430 M230 470 H430"/></g>
<g fill="none" stroke="#8c2635" stroke-width="2.5" marker-end="url(#arrow)"><path d="M430 132 H500 M430 207 H500 M430 282 H500 M430 357 H500 M430 432 H500 M330 545 V570 H500 M60 505 H224"/></g>
<g font-family="Arial,sans-serif" fill="#2e2724" font-size="18"><text x="255" y="80">Cooler at the top</text><text x="45" y="535">Hot mixture enters</text><text x="45" y="562">after heating</text><text x="238" y="607">Hot lower region</text><text x="520" y="130">Refinery gases</text><text x="520" y="154" font-size="16">Cooking and heating</text><text x="520" y="205">Gasoline (petrol)</text><text x="520" y="229" font-size="16">Car-engine fuel</text><text x="520" y="280">Kerosene</text><text x="520" y="304" font-size="16">Jet-aircraft fuel</text><text x="520" y="355">Diesel</text><text x="520" y="379" font-size="16">Suitable diesel engines</text><text x="520" y="430">Fuel oil</text><text x="520" y="454" font-size="16">Some ships, heating and power generation</text><text x="520" y="570">Bitumen: heavy residue</text><text x="520" y="594" font-size="16">Road surfaces and roofing</text><text x="43" y="108" font-size="16">Vapours rise.</text><text x="43" y="134" font-size="16">Condensation</text><text x="43" y="160" font-size="16">depends on</text><text x="43" y="186" font-size="16">boiling range.</text><text x="30" y="632" font-size="15">Schematic relative order. Fractions remain mixtures; no exact universal boiling cutoffs are shown.</text></g>
</svg>
