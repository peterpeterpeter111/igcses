<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
  <title id="title">Reagents give meaning to the observation</title>
  <desc id="desc">Original reference comparison of halide, sulfate and carbonate tests. Fresh portions are used. Silver nitrate after nitric acid gives white silver chloride, cream silver bromide or yellow silver iodide. Barium chloride after hydrochloric acid gives white barium sulfate. Acid reacting with carbonate releases gas that clouds limewater.</desc>
  <rect width="960" height="530" fill="#f7f1e7"/>
  <text x="30" y="43" font-family="Georgia, serif" font-size="27" fill="#332c27">Name the reagent, then describe the observation</text>
  <g fill="#fdf9f1" stroke="#cdbba7" stroke-width="2">
    <rect x="28" y="77" width="435" height="373"/>
    <rect x="489" y="77" width="442" height="170"/>
    <rect x="489" y="272" width="442" height="178"/>
  </g>
  <g font-family="Georgia, serif" font-size="25" fill="#863841">
    <text x="47" y="115">Halide ions</text>
    <text x="508" y="115">Sulfate ions</text>
    <text x="508" y="311">Carbonate ions</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="19" fill="#433830">
    <text x="47" y="151">Dilute nitric acid,</text><text x="47" y="177">then silver nitrate solution</text>
    <text x="508" y="151">Dilute hydrochloric acid,</text><text x="508" y="177">then barium chloride solution</text>
    <text x="508" y="349">Dilute hydrochloric acid releases gas.</text>
    <text x="508" y="379">Test that gas with limewater:</text>
  </g>
  <g stroke="#998777" stroke-width="2">
    <rect x="49" y="220" width="38" height="38" fill="#fffef9"/>
    <rect x="49" y="287" width="38" height="38" fill="#eee0b9"/>
    <rect x="49" y="354" width="38" height="38" fill="#e8ce67"/>
    <rect x="510" y="199" width="30" height="30" fill="#fffef9"/>
    <rect x="510" y="400" width="30" height="30" fill="#fffef9"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="21" fill="#433830">
    <text x="105" y="246">Cl⁻ → white AgCl precipitate</text>
    <text x="105" y="313">Br⁻ → cream AgBr precipitate</text>
    <text x="105" y="380">I⁻ → yellow AgI precipitate</text>
    <text x="554" y="222">White BaSO₄ precipitate</text>
    <text x="554" y="423">White cloudiness supports CO₂.</text>
  </g>
  <text x="47" y="426" font-family="Arial, sans-serif" font-size="17" fill="#625449">Colours are schematic; observe actual solids.</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#625449">
    <text x="30" y="486">Use fresh separate portions. HCl adds chloride; H₂SO₄ adds sulfate.</text>
    <text x="30" y="514">White appearance alone cannot identify the ion. No experimental results are claimed.</text>
  </g>
</svg>
