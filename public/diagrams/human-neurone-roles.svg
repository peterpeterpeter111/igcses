<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" role="img" aria-labelledby="title desc"><title id="title">Sensory, motor and relay neurone roles</title><desc id="desc">Original simplified cells distinguish a side cell body in a sensory school model, central-end motor cell body and myelin, and central relay connections; impulse arrows show sensory inward and motor outward roles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8c2635"/></marker></defs><rect width="960" height="790" fill="#f7f0e4"/><g font-family="Arial,sans-serif" fill="#2e2724"><text x="35" y="40" font-size="25">Three neurone roles: simplified school shapes</text><text x="35" y="72" font-size="17">Arrows show the normal pathway direction. Shapes and scales vary.</text><text x="35" y="135" font-size="22">Sensory: receptor → CNS</text><path d="M110 220 H840" stroke="#8c2635" stroke-width="5"/><path d="M400 220 V176" stroke="#8c2635" stroke-width="3"/><circle cx="400" cy="155" r="22" fill="#eadfca" stroke="#8c2635"/><circle cx="400" cy="155" r="6" fill="#8c2635"/><text x="448" y="161" font-size="17">Side cell body / nucleus</text><path d="M110 220 L80 195 M110 220 L80 245 M840 220 L878 195 M840 220 L878 245" stroke="#8c2635" stroke-width="3" fill="none"/><path d="M510 255 H735" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="330" font-size="22">Motor: CNS → effector</text><circle cx="140" cy="410" r="34" fill="#eadfca" stroke="#8c2635" stroke-width="3"/><circle cx="140" cy="410" r="8" fill="#8c2635"/><path d="M108 395 L75 365 M106 416 H65 M113 439 L80 470 M175 410 H840 M840 410 L880 380 M840 410 L880 440" stroke="#8c2635" stroke-width="4" fill="none"/><rect x="240" y="398" width="70" height="24" rx="8" fill="#b99283"/><rect x="335" y="398" width="70" height="24" rx="8" fill="#b99283"/><rect x="430" y="398" width="70" height="24" rx="8" fill="#b99283"/><rect x="525" y="398" width="70" height="24" rx="8" fill="#b99283"/><rect x="620" y="398" width="70" height="24" rx="8" fill="#b99283"/><rect x="715" y="398" width="70" height="24" rx="8" fill="#b99283"/><text x="265" y="475" font-size="17">Segmented myelin on the fibre</text><path d="M510 450 H735" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="555" font-size="22">Relay: central connections</text><circle cx="340" cy="625" r="28" fill="#eadfca" stroke="#8c2635" stroke-width="3"/><circle cx="340" cy="625" r="7" fill="#8c2635"/><path d="M313 615 L270 580 M312 627 H260 M320 646 L270 670 M370 625 H610 M610 625 L650 595 M610 625 L650 655" stroke="#8c2635" stroke-width="4" fill="none"/><path d="M420 675 H575" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="740" font-size="17">Cell bodies support the cell; impulses are not particles moving through nuclei.</text></g></svg>
