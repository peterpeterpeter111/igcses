<title id="title">Gamete structure and function</title>
<desc id="desc">Separate simplified drawings show sperm acrosome, haploid nucleus, midpiece mitochondria and tail; and egg surrounding layers, cytoplasm and haploid nucleus. The drawings are at different scales and are not micrographs.</desc>
