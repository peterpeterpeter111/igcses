<g font-family="Arial,sans-serif" fill="#473b35" font-size="16"><text x="28" y="555">Different drawing scales: the sperm is enlarged for structure labels.</text><text x="28" y="580">Original simplified model, not a micrograph. Nuclei combine to restore diploidy.</text></g>
