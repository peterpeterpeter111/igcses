<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc"><title id="title">Glucose negative-feedback comparison</title><desc id="desc">Original paired sequences: high glucose, beta-cell insulin, uptake/storage and falling glucose; low glucose, alpha-cell glucagon, liver glycogen breakdown and rising glucose.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8c2635"/></marker></defs><rect width="960" height="720" fill="#f7f0e4"/><g font-family="Arial,sans-serif" fill="#2e2724"><text x="35" y="40" font-size="25">Blood glucose: two corrective responses</text><text x="35" y="72" font-size="17">Normal school model; secretion is not necessarily an on/off switch.</text><rect x="40" y="110" width="410" height="90" fill="#eadfca" stroke="#8c2635"/><text x="53" y="142" font-size="22">Blood glucose rises</text><text x="53" y="173" font-size="17">After the stated meal</text><path d="M245 205 V234" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="240" width="410" height="90" fill="#eadfca" stroke="#8c2635"/><text x="53" y="272" font-size="22">Beta cells: more insulin</text><text x="53" y="303" font-size="17">Pancreas releases the hormone</text><path d="M245 335 V364" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="370" width="410" height="90" fill="#eadfca" stroke="#8c2635"/><text x="53" y="402" font-size="22">Uptake / glycogen storage</text><text x="53" y="433" font-size="17">Responsive tissues; liver and muscle</text><path d="M245 465 V494" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="500" width="410" height="90" fill="#eadfca" stroke="#8c2635"/><text x="53" y="532" font-size="22">Blood glucose falls</text><text x="53" y="563" font-size="17">Towards its suitable range</text><rect x="510" y="110" width="410" height="90" fill="#eadfca" stroke="#8c2635"/><text x="523" y="142" font-size="22">Blood glucose falls</text><text x="523" y="173" font-size="17">Between intake periods in the model</text><path d="M715 205 V234" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="240" width="410" height="90" fill="#eadfca" stroke="#8c2635"/><text x="523" y="272" font-size="22">Alpha cells: more glucagon</text><text x="523" y="303" font-size="17">Pancreas releases the hormone</text><path d="M715 335 V364" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="370" width="410" height="90" fill="#eadfca" stroke="#8c2635"/><text x="523" y="402" font-size="22">Liver glycogen breakdown</text><text x="523" y="433" font-size="17">Glucose released into blood</text><path d="M715 465 V494" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="500" width="410" height="90" fill="#eadfca" stroke="#8c2635"/><text x="523" y="532" font-size="22">Blood glucose rises</text><text x="523" y="563" font-size="17">Towards its suitable range</text><text x="40" y="640" font-size="19">Each response opposes its initial disturbance and then diminishes.</text><text x="40" y="672" font-size="19">Glucose is a sugar; glycogen is a storage polymer; glucagon is a hormone.</text></g></svg>
