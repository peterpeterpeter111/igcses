<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
<title id="title">Long-bone regions and tissue distribution</title>
<desc id="desc">Idealised cutaway. Expanded epiphyses contain a spongy lattice inside a compact outer layer. A thick compact wall surrounds the shaft marrow cavity. Cartilage covers the joint-facing ends.</desc>
<defs>
 <pattern id="lattice" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 0L22 22M22 0L0 22" fill="none" stroke="#a77658" stroke-width="3"/></pattern>
</defs>
<rect width="760" height="480" fill="#faf6ed"/>
<g font-family="Georgia,serif" fill="#332a27">
<text x="30" y="38" font-size="23">A long bone, opened along its length</text>
<text x="30" y="61" font-family="Arial,sans-serif" font-size="13" fill="#74655d">Original teaching model · proportions simplified</text>
</g>
<!-- Compact outer tissue connects both expanded ends to the shaft. -->
<path d="M325 93C290 89 260 112 268 145C272 165 290 174 300 195L300 333C290 353 270 365 268 384C264 413 291 435 325 430C359 435 386 413 382 384C380 365 360 353 350 333L350 195C360 174 378 165 382 145C390 112 360 89 325 93Z" fill="#ddc4a0" stroke="#714d3c" stroke-width="3"/>
<path d="M324 105C295 101 277 119 280 142C283 161 300 168 310 183L340 183C350 168 367 161 370 142C373 119 355 101 324 105Z" fill="url(#lattice)" stroke="#a77658" stroke-width="1.5"/>
<path d="M310 347C300 362 283 369 280 388C277 411 295 421 324 418C355 421 373 411 370 388C367 369 350 362 340 347Z" fill="url(#lattice)" stroke="#a77658" stroke-width="1.5"/>
<rect x="313" y="197" width="24" height="139" fill="#e6b87e" stroke="#a77658" stroke-width="1.5"/>
<!-- End caps represent articular cartilage, separate from bone. -->
<path d="M270 121C278 98 300 87 325 93C350 87 372 98 380 121" fill="none" stroke="#6e8987" stroke-width="9" stroke-linecap="round"/>
<path d="M270 401C280 424 303 434 325 430C347 434 370 424 380 401" fill="none" stroke="#6e8987" stroke-width="9" stroke-linecap="round"/>
<g fill="none" stroke="#8b343e" stroke-width="1.5">
 <path d="M287 117H208V101H50"/>
 <path d="M301 146H208V157H50"/>
 <path d="M303 255H205V253H50"/>
 <path d="M327 268H417V286H563"/>
 <path d="M357 144H448V130H563"/>
 <path d="M351 390H448V404H563"/>
 <path d="M399 196H411V335H399"/>
</g>
<g font-family="Arial,sans-serif" font-size="16" fill="#332a27">
 <text x="50" y="92">Articular cartilage</text>
 <text x="50" y="150">Spongy bone</text>
 <text x="50" y="245">Compact bone wall</text>
 <text x="465" y="122">Epiphysis (end)</text>
 <text x="465" y="277">Marrow cavity</text>
 <text x="426" y="241">Diaphysis</text><text x="426" y="262">(shaft)</text>
 <text x="465" y="397">Epiphysis (end)</text>
 <text x="30" y="462" font-size="12" fill="#74655d">Spongy bone is supporting tissue with spaces; the marrow cavity is not a joint cavity.</text>
</g>
</svg>
