<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">Villus absorption adaptations</title><desc id="desc">Original villus schematic with enlarged surface, one-cell-thick epithelium, capillary network and separate central lacteal, with each feature linked to its transfer role.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8c2635"/></marker></defs><rect width="960" height="680" fill="#f7f0e4"/><g font-family="Arial,sans-serif" fill="#2e2724"><text x="35" y="40" font-size="25">A villus: structure linked to transfer</text><text x="35" y="73" font-size="17">One projection of the intestinal lining; schematic, not to scale.</text><path d="M130 570 V285 C130 130 385 130 385 285 V570" fill="#eadfca" stroke="#8c2635" stroke-width="9"/><path d="M195 568 V297 C195 240 320 240 320 297 V568" fill="none" stroke="#8c2635" stroke-width="9"/><path d="M255 568 V313 C255 292 275 292 275 313 V568" fill="none" stroke="#9c733d" stroke-width="14"/><path d="M128 260 H75 M135 230 L90 212 M151 204 L120 171 M182 183 L160 140 M219 172 L211 125 M260 168 V118 M300 172 L308 125 M338 190 L365 145 M367 218 L410 191 M381 251 H425" stroke="#8c2635" stroke-width="3"/><path d="M365 181 L490 160 H540" fill="none" stroke="#51463f"/><text x="552" y="165" font-size="20">Large area: villi and microvilli</text><path d="M385 325 H540" stroke="#51463f"/><text x="552" y="322" font-size="20">One-cell-thick surface epithelium</text><text x="552" y="350" font-size="17">Short transfer distance</text><path d="M319 408 H540" stroke="#51463f"/><text x="552" y="405" font-size="20">Blood capillary network</text><text x="552" y="433" font-size="17">Carries absorbed sugars/amino acids away</text><path d="M274 485 H540" stroke="#51463f"/><text x="552" y="482" font-size="20">Lacteal: lymphatic vessel</text><text x="552" y="510" font-size="17">Receives processed lipid transport particles</text><text x="105" y="632" font-size="18">Gut lumen is outside the villus surface, not inside a blood vessel.</text></g></svg>
