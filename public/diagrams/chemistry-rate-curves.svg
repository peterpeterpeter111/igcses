<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Faster collection, same final amount</title><desc id="desc">Original schematic gas-volume versus time curves under matched limiting-reactant and gas conditions. Faster curve is steeper initially; both approach the same plateau. Curve slope indicates rate, final height indicates collected amount.</desc>
<rect width="960" height="500" fill="#f7f0e4"/>
<g font-family="Georgia,serif" fill="#2e2724"><text x="36" y="40" font-size="25">Speed and final amount are different</text></g>
<g fill="none" stroke="#51463f" stroke-width="2"><path d="M90 375 V90 M90 375 H675"/></g>
<path d="M90 145 H675" stroke="#bcb0a0" stroke-width="2" stroke-dasharray="6 6"/>
<g fill="none" stroke-width="4"><path d="M90 375 C130 207 228 145 355 145 H660" stroke="#8c2635"/><path d="M90 375 C200 230 320 165 460 150 C520 145 580 145 660 145" stroke="#947342" stroke-dasharray="10 6"/></g>
<g font-family="Arial,sans-serif" fill="#2e2724" font-size="18"><text x="100" y="88">Collected gas volume</text><text x="540" y="407">Time →</text><text x="159" y="213" fill="#8c2635">Faster</text><text x="296" y="247" fill="#765b35">Slower</text><text x="706" y="148">Same final amount</text><text x="706" y="204">Steeper slope</text><text x="706" y="232">means greater rate.</text><text x="706" y="298">Plateau height</text><text x="706" y="326">means collected amount.</text><text x="36" y="450" font-size="16">Same limiting amount, complete reaction and matched gas conditions are assumed.</text><text x="36" y="478" font-size="16">Schematic curves without a numerical scale; no measurements were performed.</text></g>
</svg>
