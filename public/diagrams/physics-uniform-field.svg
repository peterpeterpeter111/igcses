<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
<title id="title">Uniform central field between unlike pole faces</title>
<desc id="desc">The north pole face on the left and south pole face on the right have straight, parallel, equally spaced field arrows pointing right in the central gap. Fringing at the edges is not shown.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7b2c3a"/></marker></defs>
<rect width="720" height="380" rx="4" fill="#faf5ec"/>
<text x="32" y="40" fill="#332b29" font-family="Georgia,serif" font-size="23">Field in the central gap</text>
<rect x="65" y="88" width="110" height="215" fill="#7b2c3a"/>
<rect x="545" y="88" width="110" height="215" fill="#4d5356"/>
<g font-family="Arial,sans-serif" font-size="36" fill="#fff"><text x="107" y="205">N</text><text x="588" y="205">S</text></g>
<g stroke="#7b2c3a" stroke-width="3" marker-end="url(#arrow)">
<path d="M188 125H531"/><path d="M188 170H531"/><path d="M188 215H531"/><path d="M188 260H531"/>
</g>
<g font-family="Arial,sans-serif" font-size="17" fill="#473b35">
<text x="213" y="318">Parallel lines · equal spacing · N to S</text>
<text x="32" y="355">Central region only: real fields spread near the edges.</text>
</g></svg>
