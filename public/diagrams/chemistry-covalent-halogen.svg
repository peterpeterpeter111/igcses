<path data-owner="Cl1" data-electron="cross" data-kind="lone" d="M431.000 134.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<path data-owner="Cl1" data-electron="cross" data-kind="lone" d="M431.000 148.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<text x="25" y="278" font-size="17">• H · × Cl</text>
</g>
</g></svg>
