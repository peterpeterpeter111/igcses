<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="title desc"><title id="title">Original halogen shared-electron models</title><desc id="desc">Each panel shows outer-electron pairs and an explicit original-atom key; layouts do not specify molecular shapes.</desc><rect width="600" height="720" fill="#faf7ef"/><g font-family="Arial,sans-serif" fill="#352b25">
<text x="25" y="30" font-size="22" font-weight="700">Shared pairs and lone pairs</text>
<text x="25" y="57" font-size="17">Outer-electron bookkeeping, not molecular shapes.</text>
<g data-molecule="Cl2" transform="translate(0,80)"><path d="M20 0H580" stroke="#c5b7a9"/><text x="25" y="27" font-size="20" font-weight="700">Chlorine · Cl₂ · 14 electrons</text>
<text data-atom="Cl1" data-element="Cl" x="200" y="152" text-anchor="middle" font-size="23">Cl</text>
<text data-atom="Cl2" data-element="Cl" x="400" y="152" text-anchor="middle" font-size="23">Cl</text>
<circle data-owner="Cl1" data-electron="dot" data-kind="bond" data-edge="Cl1-Cl2" cx="295.000" cy="145.000" r="3.5" fill="#8c4c3f"/>
<path data-owner="Cl2" data-electron="cross" data-kind="bond" data-edge="Cl1-Cl2" d="M301.000 141.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<circle data-owner="Cl1" data-electron="dot" data-kind="lone" cx="193.000" cy="110.000" r="3.5" fill="#8c4c3f"/>
<circle data-owner="Cl1" data-electron="dot" data-kind="lone" cx="207.000" cy="110.000" r="3.5" fill="#8c4c3f"/>
<circle data-owner="Cl1" data-electron="dot" data-kind="lone" cx="193.000" cy="180.000" r="3.5" fill="#8c4c3f"/>
<circle data-owner="Cl1" data-electron="dot" data-kind="lone" cx="207.000" cy="180.000" r="3.5" fill="#8c4c3f"/>
<circle data-owner="Cl1" data-electron="dot" data-kind="lone" cx="165.000" cy="138.000" r="3.5" fill="#8c4c3f"/>
<circle data-owner="Cl1" data-electron="dot" data-kind="lone" cx="165.000" cy="152.000" r="3.5" fill="#8c4c3f"/>
<path data-owner="Cl2" data-electron="cross" data-kind="lone" d="M389.000 106.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<path data-owner="Cl2" data-electron="cross" data-kind="lone" d="M403.000 106.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<path data-owner="Cl2" data-electron="cross" data-kind="lone" d="M389.000 176.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<path data-owner="Cl2" data-electron="cross" data-kind="lone" d="M403.000 176.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<path data-owner="Cl2" data-electron="cross" data-kind="lone" d="M431.000 134.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<path data-owner="Cl2" data-electron="cross" data-kind="lone" d="M431.000 148.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<text x="25" y="278" font-size="17">• left Cl · × right Cl</text>
</g>
<g data-molecule="HCl" transform="translate(0,400)"><path d="M20 0H580" stroke="#c5b7a9"/><text x="25" y="27" font-size="20" font-weight="700">Hydrogen chloride · HCl · 8 electrons</text>
<text data-atom="H1" data-element="H" x="200" y="152" text-anchor="middle" font-size="23">H</text>
<text data-atom="Cl1" data-element="Cl" x="400" y="152" text-anchor="middle" font-size="23">Cl</text>
<circle data-owner="H1" data-electron="dot" data-kind="bond" data-edge="H1-Cl1" cx="295.000" cy="145.000" r="3.5" fill="#8c4c3f"/>
<path data-owner="Cl1" data-electron="cross" data-kind="bond" data-edge="H1-Cl1" d="M301.000 141.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<path data-owner="Cl1" data-electron="cross" data-kind="lone" d="M389.000 106.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<path data-owner="Cl1" data-electron="cross" data-kind="lone" d="M403.000 106.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<path data-owner="Cl1" data-electron="cross" data-kind="lone" d="M389.000 176.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
