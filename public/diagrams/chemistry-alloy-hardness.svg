<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">How different atom sizes can hinder deformation</title>
  <desc id="desc">An original two-dimensional schematic compares regular rows of equal-sized metal atoms with a larger substituted atom and displaced neighbours. Distortion can hinder plastic movement. This is one model, not a measured structure or a universal comparison of alloys.</desc>
  <defs>
    <circle id="atom" r="25" fill="#d9cbbb" stroke="#62564d" stroke-width="2"/>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#8e343a"/></marker>
  </defs>
  <rect width="960" height="450" fill="#f7f1e7"/>
  <g fill="#332c27" font-family="Georgia, serif">
    <text x="40" y="42" font-size="25">Atom size → arrangement → resistance to deformation</text>
    <text x="48" y="90" font-size="22">Pure-metal model</text>
    <text x="515" y="90" font-size="22">One alloy model</text>
  </g>
  <g stroke="#d5c7b6" fill="none">
    <rect x="32" y="108" width="415" height="220" rx="3"/>
    <rect x="498" y="108" width="430" height="220" rx="3"/>
  </g>
  <g>
    <use href="#atom" x="90" y="159"/><use href="#atom" x="160" y="159"/><use href="#atom" x="230" y="159"/><use href="#atom" x="300" y="159"/><use href="#atom" x="370" y="159"/>
    <use href="#atom" x="90" y="219"/><use href="#atom" x="160" y="219"/><use href="#atom" x="230" y="219"/><use href="#atom" x="300" y="219"/><use href="#atom" x="370" y="219"/>
    <use href="#atom" x="90" y="279"/><use href="#atom" x="160" y="279"/><use href="#atom" x="230" y="279"/><use href="#atom" x="300" y="279"/><use href="#atom" x="370" y="279"/>
    <use href="#atom" x="555" y="158"/><use href="#atom" x="625" y="151"/><use href="#atom" x="700" y="143"/><use href="#atom" x="775" y="151"/><use href="#atom" x="845" y="158"/>
    <use href="#atom" x="555" y="219"/><use href="#atom" x="617" y="219"/><circle cx="700" cy="219" r="38" fill="#a45157" stroke="#763039" stroke-width="2"/><use href="#atom" x="783" y="219"/><use href="#atom" x="845" y="219"/>
    <use href="#atom" x="555" y="280"/><use href="#atom" x="625" y="287"/><use href="#atom" x="700" y="295"/><use href="#atom" x="775" y="287"/><use href="#atom" x="845" y="280"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#433830">
    <text x="49" y="356">Regular rows can move during deformation.</text>
    <text x="515" y="356">Larger atom distorts nearby arrangement.</text>
    <text x="515" y="381">Plastic movement can become harder.</text>
    <text x="40" y="424" font-size="16">Illustrative 2D positions and sizes. Other alloy structures and heat treatment also affect properties.</text>
  </g>
</svg>
