<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title desc"><title id="title">Food and digestive secretions</title><desc id="desc">Food follows mouth, oesophagus, stomach, small and large intestine, rectum and anus. Liver bile is stored in gall bladder; bile and pancreatic enzymes join the small intestine.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8c2635"/></marker></defs><rect width="960" height="760" fill="#f7f0e4"/><g font-family="Arial,sans-serif" fill="#2e2724"><text x="35" y="40" font-size="25">Food route and secretion routes</text><text x="35" y="72" font-size="17">Schematic flow, not anatomical position or scale.</text><rect x="40" y="105" width="450" height="80" rx="3" fill="#eadfca" stroke="#8c2635"/><text x="60" y="133" font-size="22">Mouth</text><text x="60" y="162" font-size="17">Chewing; saliva starts starch digestion</text><path d="M265 187 V204" stroke="#8c2635" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="210" width="450" height="80" rx="3" fill="#eadfca" stroke="#8c2635"/><text x="60" y="238" font-size="22">Oesophagus</text><text x="60" y="267" font-size="17">Peristalsis moves the bolus</text><path d="M265 292 V309" stroke="#8c2635" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="315" width="450" height="80" rx="3" fill="#eadfca" stroke="#8c2635"/><text x="60" y="343" font-size="22">Stomach</text><text x="60" y="372" font-size="17">Mixing; acid and pepsin</text><path d="M265 397 V414" stroke="#8c2635" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="420" width="450" height="80" rx="3" fill="#eadfca" stroke="#8c2635"/><text x="60" y="448" font-size="22">Small intestine</text><text x="60" y="477" font-size="17">Further digestion and nutrient absorption</text><path d="M265 502 V519" stroke="#8c2635" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="525" width="450" height="80" rx="3" fill="#eadfca" stroke="#8c2635"/><text x="60" y="553" font-size="22">Large intestine</text><text x="60" y="582" font-size="17">Water absorption; faeces formation</text><path d="M265 607 V624" stroke="#8c2635" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="630" width="450" height="80" rx="3" fill="#eadfca" stroke="#8c2635"/><text x="60" y="658" font-size="22">Rectum and anus</text><text x="60" y="687" font-size="17">Storage then egestion</text><rect x="600" y="130" width="305" height="76" fill="#eadfca" stroke="#9c733d"/><text x="620" y="158" font-size="21">Liver</text><text x="620" y="186" font-size="17">Produces bile</text><path d="M750 210 V250" stroke="#8c2635" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="600" y="260" width="305" height="76" fill="#eadfca" stroke="#9c733d"/><text x="620" y="288" font-size="21">Gall bladder</text><text x="620" y="316" font-size="17">Stores bile</text><path d="M750 340 V440 H490" fill="none" stroke="#8c2635" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="600" y="495" width="305" height="76" fill="#eadfca" stroke="#9c733d"/><text x="620" y="523" font-size="21">Pancreas</text><text x="620" y="551" font-size="17">Produces digestive enzymes</text><path d="M600 530 H555 V455 H490" fill="none" stroke="#8c2635" stroke-width="2.5" marker-end="url(#arrow)"/><text x="585" y="655" font-size="17">Secretions join the small intestine.</text><text x="585" y="681" font-size="17">Food does not pass through these organs.</text></g></svg>
