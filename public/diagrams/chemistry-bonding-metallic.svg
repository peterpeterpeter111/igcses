<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Metallic bonding: a two-dimensional slice</title><desc id="desc">Two positive-ion arrays surrounded by delocalised electrons. The middle row in the second array is shifted; attraction remains, representing malleability.</desc><rect width="900" height="450" fill="#faf5eb"/><g font-family="Georgia,serif" fill="#322725"><text x="32" y="38" font-size="25">Metallic bonding: a two-dimensional slice</text><circle cx="100" cy="140" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="100" y="148" text-anchor="middle" font-size="25">+</text><circle cx="200" cy="140" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="200" y="148" text-anchor="middle" font-size="25">+</text><circle cx="300" cy="140" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="300" y="148" text-anchor="middle" font-size="25">+</text><circle cx="100" cy="215" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="100" y="223" text-anchor="middle" font-size="25">+</text><circle cx="200" cy="215" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="200" y="223" text-anchor="middle" font-size="25">+</text><circle cx="300" cy="215" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="300" y="223" text-anchor="middle" font-size="25">+</text><circle cx="100" cy="290" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="100" y="298" text-anchor="middle" font-size="25">+</text><circle cx="200" cy="290" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="200" y="298" text-anchor="middle" font-size="25">+</text><circle cx="300" cy="290" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="300" y="298" text-anchor="middle" font-size="25">+</text><text x="135" y="181" text-anchor="middle" font-size="17">e⁻</text><text x="235" y="181" text-anchor="middle" font-size="17">e⁻</text><text x="335" y="181" text-anchor="middle" font-size="17">e⁻</text><text x="135" y="256" text-anchor="middle" font-size="17">e⁻</text><text x="235" y="256" text-anchor="middle" font-size="17">e⁻</text><text x="335" y="256" text-anchor="middle" font-size="17">e⁻</text><text x="200" y="346" text-anchor="middle" font-size="19">Regular rows</text><circle cx="550" cy="140" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="550" y="148" text-anchor="middle" font-size="25">+</text><circle cx="650" cy="140" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="650" y="148" text-anchor="middle" font-size="25">+</text><circle cx="750" cy="140" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="750" y="148" text-anchor="middle" font-size="25">+</text><circle cx="584" cy="215" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="584" y="223" text-anchor="middle" font-size="25">+</text><circle cx="684" cy="215" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="684" y="223" text-anchor="middle" font-size="25">+</text><circle cx="784" cy="215" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="784" y="223" text-anchor="middle" font-size="25">+</text><circle cx="550" cy="290" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="550" y="298" text-anchor="middle" font-size="25">+</text><circle cx="650" cy="290" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="650" y="298" text-anchor="middle" font-size="25">+</text><circle cx="750" cy="290" r="24" fill="#eee0cf" stroke="#7d423e" stroke-width="2"/><text x="750" y="298" text-anchor="middle" font-size="25">+</text><text x="585" y="181" text-anchor="middle" font-size="17">e⁻</text><text x="685" y="181" text-anchor="middle" font-size="17">e⁻</text><text x="785" y="181" text-anchor="middle" font-size="17">e⁻</text><text x="585" y="256" text-anchor="middle" font-size="17">e⁻</text><text x="685" y="256" text-anchor="middle" font-size="17">e⁻</text><text x="785" y="256" text-anchor="middle" font-size="17">e⁻</text><text x="650" y="346" text-anchor="middle" font-size="19">One row shifted</text><path d="M445 207h36m-8 -7l8 7l-8 7" stroke="#9a7444" stroke-width="2" fill="none"/><text x="450" y="392" text-anchor="middle" font-size="19">Positive metal ions + delocalised electrons</text><text x="450" y="425" text-anchor="middle" font-size="16">Electron mobility enables conduction; persistent attraction enables malleability.</text></g></svg>
