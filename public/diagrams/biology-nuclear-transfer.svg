<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 770" role="img" aria-labelledby="title desc">
  <title id="title">Mammalian nuclear-transfer cloning: three distinct contributions</title>
  <desc id="desc">A mature body-cell donor provides a diploid nucleus. An egg donor provides an unfertilised egg whose nucleus is removed, retaining cytoplasm. Transfer the donor nucleus and activate the reconstructed cell. If development succeeds, transfer an embryo to a surrogate that supports pregnancy. Nuclear DNA derives from the mature-cell donor; mitochondria mainly derive from the recipient egg.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#973b40"/></marker></defs>
  <rect width="800" height="770" rx="8" fill="#fbf5e9"/>
  <g font-family="system-ui,sans-serif" fill="#342a27">
    <text x="40" y="39" font-size="23" font-weight="650">Nuclear donor, egg donor and surrogate</text>
    <text x="40" y="66" font-size="16">Paper 2B · conceptual stages, with conditional development</text>
    <g fill="#f4e8d8" stroke="#bc9c7b" stroke-width="1.5">
      <rect x="40" y="95" width="330" height="151" rx="5"/>
      <rect x="430" y="95" width="330" height="151" rx="5"/>
      <rect x="170" y="304" width="460" height="95" rx="5"/>
      <rect x="170" y="449" width="460" height="80" rx="5"/>
      <rect x="170" y="579" width="460" height="80" rx="5"/>
    </g>
    <g font-size="19" font-weight="650">
      <text x="59" y="127">Mature body-cell donor</text>
      <text x="449" y="127">Egg-cell donor</text>
      <text x="191" y="335">Transfer the diploid nucleus</text>
      <text x="191" y="480">Early divisions → embryo</text>
      <text x="191" y="610">Transfer to a suitable surrogate</text>
    </g>
    <g font-size="17">
      <text x="59" y="160">Provides a diploid nucleus (2n).</text>
      <text x="59" y="189">Source of the copied</text>
      <text x="59" y="215">nuclear genetic information.</text>
      <text x="449" y="160">Remove the egg nucleus.</text>
      <text x="449" y="189">Keep the egg cytoplasm</text>
      <text x="449" y="215">and organelles.</text>
      <text x="191" y="366">Into the enucleated egg; activate it.</text>
      <text x="191" y="510">If development succeeds.</text>
      <text x="191" y="640">Supports pregnancy; not the nuclear donor.</text>
    </g>
    <g fill="none" stroke="#973b40" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M205 246V277L280 299"/>
      <path d="M595 246V277L520 299"/>
      <path d="M400 399V441"/>
      <path d="M400 529V571"/>
    </g>
    <rect x="40" y="689" width="720" height="61" rx="5" fill="#eae0cd"/>
    <text x="57" y="715" font-size="17">No sperm nucleus is added. Successful birth is not guaranteed.</text>
    <text x="57" y="738" font-size="16">Mitochondrial DNA mainly comes from the recipient egg.</text>
  </g>
</svg>
