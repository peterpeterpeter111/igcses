<text x="361" y="517" font-size="18" font-weight="600" fill="#963d43">Marker moves towards the shoot</text>
<g fill="none" stroke="#8b8175" stroke-width="1.5">
<path d="M510 204H420V164H327"/>
<path d="M566 313H602V286H625"/>
