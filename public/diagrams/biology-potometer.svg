</g>
<text x="70" y="145" font-size="19" font-weight="600">Water reservoir</text>
<text x="70" y="171" font-size="16">Used to reset the marker</text>
<text x="634" y="281" font-size="19" font-weight="600">Reset valve closed</text>
<text x="634" y="306" font-size="16">during the timed reading</text>
<text x="849" y="358" font-size="17" font-weight="600">Tight seal</text>
<text x="849" y="382" font-size="15">around shoot</text>
<text x="55" y="319" font-size="19" font-weight="600">One air marker</text>
<text x="55" y="344" font-size="16">Read the same edge each time</text>
<text x="336" y="564" font-size="18" font-weight="600">Scale beside the capillary</text>
<text x="336" y="591" font-size="16">Distance ÷ time; volume needs the internal tube area.</text>
<text x="249" y="643" font-size="18" font-weight="600">Inlet below water</text>
<text x="249" y="669" font-size="16">No open air inlet during timing</text>
<text x="34" y="716" font-size="16" fill="#686158">Uptake is a proxy for transpiration, not a direct or exact measurement of evaporative water loss.</text>
</g></svg>
