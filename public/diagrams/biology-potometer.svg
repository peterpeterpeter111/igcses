<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc">
<title id="title">A bubble potometer measures water uptake</title>
<desc id="desc">Original apparatus schematic, not to scale. A leafy shoot is sealed to a water-filled capillary. The capillary inlet remains below water in a beaker at the left. One small air marker in the horizontal tube moves right towards the shoot as water is taken up. A separate water reservoir connects through a closed reset valve; that route is shut during timing.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#963d43" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="740" fill="#fbf8f0"/>
<g font-family="system-ui, sans-serif" fill="#292524">
<text x="34" y="43" font-size="26" font-weight="650">A bubble potometer: water uptake</text>
<text x="34" y="75" font-size="16" fill="#686158">Original apparatus model · not to scale · one marker, tight seals</text>
<!-- Leafy shoot joins the tube at its cut end. Leaves are symbolic. -->
<g stroke="#57684c" stroke-width="6" fill="none"><path d="M775 325V154M775 220L713 176M775 196L833 150M775 266L840 227"/></g>
<g fill="#c5cba7" stroke="#57684c" stroke-width="2">
<path d="M713 176Q659 180 665 128Q712 123 713 176Z"/>
<path d="M833 150Q833 104 884 103Q893 150 833 150Z"/>
<path d="M840 227Q850 184 902 192Q901 237 840 227Z"/>
<path d="M775 155Q744 126 765 97Q800 117 775 155Z"/>
</g>
<!-- Reservoir branch is interrupted by the closed valve below. -->
<path d="M510 165V239Q510 258 547 258Q584 258 584 239V165" fill="none" stroke="#6b6257" stroke-width="3"/>
<path d="M514 195H580V238Q580 253 547 253Q514 253 514 238Z" fill="#9eb7b0"/>
