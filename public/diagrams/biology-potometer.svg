<path d="M529 313H565M547 304V290M536 290H558" stroke="#963d43" stroke-width="3"/>
<!-- Inlet remains below the beaker's water surface. -->
<path d="M95 532V680H195V532" fill="none" stroke="#6b6257" stroke-width="3"/>
<path d="M99 558H191V676H99Z" fill="#c0d0c7"/>
<path d="M99 558H191" stroke="#738f87" stroke-width="2"/>
<path d="M145 639V405H775V328" fill="none" stroke="#6b6257" stroke-width="20" stroke-linejoin="round"/>
<path d="M145 639V405H775V328" fill="none" stroke="#9eb7b0" stroke-width="14" stroke-linejoin="round"/>
<rect x="759" y="316" width="32" height="22" fill="#9b8067" stroke="#574237" stroke-width="2"/>
<!-- One deliberate air marker inside the otherwise water-filled capillary. -->
<rect x="316" y="399" width="24" height="12" rx="6" fill="#fbf8f0" stroke="#665c4f" stroke-width="1.5"/>
<path d="M280 435H710" stroke="#8b8175" stroke-width="1.5"/>
