<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">Exothermic and endothermic energy levels</title><desc id="desc">Original schematic energy levels: exothermic products lower than reactants and negative delta H; endothermic products higher and positive delta H. No activation barrier or measured scale.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#8c2635" stroke-width="1.5"/></marker></defs>
<rect width="960" height="470" fill="#f7f0e4"/>
<g font-family="Georgia,serif" fill="#2e2724"><text x="36" y="40" font-size="25">Energy levels: follow the overall change</text>
<text x="94" y="95" font-size="22">Exothermic</text><text x="550" y="95" font-size="22">Endothermic</text></g>
<g fill="none" stroke="#51463f" stroke-width="2"><path d="M72 360 V120 M72 360 H430 M528 360 V120 M528 360 H886"/></g>
<g stroke="#8c2635" stroke-width="5"><path d="M100 180 H235 M275 290 H410 M556 290 H691 M731 180 H866"/></g>
<g fill="none" stroke="#8c2635" stroke-width="2.5" marker-end="url(#arrow)"><path d="M252 183 V287 M708 287 V183"/></g>
<g font-family="Arial,sans-serif" font-size="18" fill="#2e2724"><text x="84" y="137">Energy</text><text x="540" y="137">Energy</text><text x="100" y="166">Reactants</text><text x="290" y="319">Products</text><text x="556" y="319">Reactants</text><text x="746" y="166">Products</text><text x="267" y="235">ΔH &lt; 0</text><text x="723" y="245">ΔH &gt; 0</text><text x="93" y="393">Products lower: energy released</text><text x="549" y="393">Products higher: energy absorbed</text><text x="36" y="442" font-size="16">Schematic levels, on the same reaction basis. Heights are not measured values.</text></g>
</svg>
