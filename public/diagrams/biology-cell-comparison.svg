<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="title desc"><title id="title">Typical cell models</title><desc id="desc">Plant and animal schematic cells with numbered features: 1 nucleus, 2 cytoplasm, 3 cell membrane, 4 plant cell wall, 5 mitochondrion, 6 chloroplast, 7 ribosomes, 8 large plant vacuole. Not to scale.</desc><rect width="900" height="660" fill="#faf5eb"/><g font-family="Georgia,serif" fill="#322725"><text x="32" y="40" font-size="25">Typical cells: structure and location</text><text x="115" y="86" font-size="20">Photosynthetic plant cell</text><text x="595" y="86" font-size="20">Typical animal cell</text><rect x="80" y="110" width="300" height="300" rx="14" fill="#eadccc" stroke="#926d49" stroke-width="7"/><rect x="94" y="124" width="272" height="272" rx="8" fill="#f5eee1" stroke="#84313a" stroke-width="2"/><ellipse cx="690" cy="260" rx="140" ry="145" fill="#f5eee1" stroke="#84313a" stroke-width="2"/><rect x="173" y="189" width="161" height="143" rx="12" fill="#e1e6de" stroke="#748171" stroke-width="2"/><circle cx="130" cy="250" r="25" fill="#cfada8" stroke="#7e2632" stroke-width="2"/><circle cx="660" cy="250" r="30" fill="#cfada8" stroke="#7e2632" stroke-width="2"/><g fill="#d6dfca" stroke="#738369" stroke-width="2"><ellipse cx="150" cy="155" rx="27" ry="13"/><ellipse cx="300" cy="155" rx="27" ry="13"/></g><g fill="#dec3ae" stroke="#916043" stroke-width="2"><ellipse cx="220" cy="364" rx="26" ry="12"/><ellipse cx="755" cy="305" rx="26" ry="12"/></g><g fill="#322725"><circle cx="133" cy="328" r="2.7"/><circle cx="146" cy="319" r="2.7"/><circle cx="154" cy="330" r="2.7"/><circle cx="141" cy="341" r="2.7"/><circle cx="606" cy="317" r="2.7"/><circle cx="619" cy="327" r="2.7"/><circle cx="608" cy="339" r="2.7"/></g><g font-size="18" text-anchor="middle"><text x="130" y="256">1</text><text x="660" y="256">1</text><text x="343" y="350">2</text><text x="762" y="235">2</text><text x="151" y="388">3</text><text x="851" y="263">3</text><text x="62" y="255">4</text><text x="220" y="371">5</text><text x="755" y="312">5</text><text x="150" y="161">6</text><text x="300" y="161">6</text><text x="145" y="364">7</text><text x="627" y="354">7</text><text x="253" y="267">8</text></g><path d="M145 380L117 396M840 257L830 257M67 249L77 249" stroke="#322725" fill="none"/><g font-size="18"><text x="80" y="468">1 · Nucleus</text><text x="370" y="468">2 · Cytoplasm</text><text x="645" y="468">3 · Cell membrane</text><text x="80" y="509">4 · Cellulose wall</text><text x="370" y="509">5 · Mitochondrion</text><text x="645" y="509">6 · Chloroplast</text><text x="80" y="550">7 · Ribosomes</text><text x="370" y="550">8 · Large vacuole</text></g><text x="80" y="602" font-size="17">Original simplified models; enlarged symbols, not a microscope image or a scale drawing.</text><text x="80" y="634" font-size="17">Underground root cells commonly lack chloroplasts; specialised cells differ from these models.</text></g></svg>
