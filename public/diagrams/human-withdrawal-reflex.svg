<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" role="img" aria-labelledby="title desc"><title id="title">Spinal withdrawal-reflex sequence</title><desc id="desc">Original ordered receptor, sensory, central relay/synapse, motor and muscle-response model, with conscious awareness and non-universal circuit qualifications.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8c2635"/></marker></defs><rect width="960" height="820" fill="#f7f0e4"/><g font-family="Arial,sans-serif" fill="#2e2724"><text x="35" y="40" font-size="25">A spinal withdrawal reflex: sequence and connections</text><text x="35" y="72" font-size="17">Conceptual protective response; do not test painful stimuli.</text><rect x="75" y="110" width="810" height="90" fill="#eadfca" stroke="#8c2635"/><text x="95" y="143" font-size="23">Stimulus detected by receptor</text><text x="95" y="175" font-size="19">Sensory input begins</text><path d="M480 204 V225" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="230" width="810" height="90" fill="#eadfca" stroke="#8c2635"/><text x="95" y="263" font-size="23">Sensory neurone to spinal cord</text><text x="95" y="295" font-size="19">Incoming central connection</text><path d="M480 324 V345" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="350" width="810" height="90" fill="#eadfca" stroke="#8c2635"/><text x="95" y="383" font-size="23">Relay neurone and synapses in cord</text><text x="95" y="415" font-size="19">Local circuit coordinates output</text><path d="M480 444 V465" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="470" width="810" height="90" fill="#eadfca" stroke="#8c2635"/><text x="95" y="503" font-size="23">Motor neurone to effector muscle</text><text x="95" y="535" font-size="19">Outgoing command</text><path d="M480 564 V585" stroke="#8c2635" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="590" width="810" height="90" fill="#eadfca" stroke="#8c2635"/><text x="95" y="623" font-size="23">Muscle contracts: withdrawal response</text><text x="95" y="655" font-size="19">No deliberate decision is needed first</text><text x="75" y="740" font-size="19">Information can also reach the brain for awareness.</text><text x="75" y="771" font-size="19">This three-neurone pathway is not a diagram of every kind of reflex.</text></g></svg>
