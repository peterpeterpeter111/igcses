<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620" role="img" aria-labelledby="title desc"><title id="title">States and chemical composition</title><desc id="desc">Original six-panel model: A solid, B liquid, C gas; D A–A element molecules, E A–B compound molecules, F a mixture of both. Shapes mark atom types in lower panels; lines show bonds. Snapshot positions are schematic and motion is explained in the lesson. Not to scale.</desc><rect width="600" height="620" fill="#faf6ed"/><g font-family="system-ui,sans-serif" fill="#312a26"><text x="24" y="35" font-size="23" font-weight="650">States and chemical composition</text><text x="24" y="63" font-size="14">Original model · motion described in text · not to scale</text><rect x="24" y="88" width="170" height="181" fill="#f4e9db" stroke="#a18571"/><text x="38" y="118" font-size="18" font-weight="600">A · Solid</text><rect x="214" y="88" width="170" height="181" fill="#f4e9db" stroke="#a18571"/><text x="228" y="118" font-size="18" font-weight="600">B · Liquid</text><rect x="404" y="88" width="170" height="181" fill="#f4e9db" stroke="#a18571"/><text x="418" y="118" font-size="18" font-weight="600">C · Gas</text><circle cx="48" cy="156" r="8" fill="#873c44"/><circle cx="76" cy="156" r="8" fill="#873c44"/><circle cx="104" cy="156" r="8" fill="#873c44"/><circle cx="132" cy="156" r="8" fill="#873c44"/><circle cx="48" cy="181" r="8" fill="#873c44"/><circle cx="76" cy="181" r="8" fill="#873c44"/><circle cx="104" cy="181" r="8" fill="#873c44"/><circle cx="132" cy="181" r="8" fill="#873c44"/><circle cx="48" cy="206" r="8" fill="#873c44"/><circle cx="76" cy="206" r="8" fill="#873c44"/><circle cx="104" cy="206" r="8" fill="#873c44"/><circle cx="132" cy="206" r="8" fill="#873c44"/><circle cx="48" cy="231" r="8" fill="#873c44"/><circle cx="76" cy="231" r="8" fill="#873c44"/><circle cx="104" cy="231" r="8" fill="#873c44"/><circle cx="132" cy="231" r="8" fill="#873c44"/><circle cx="237" cy="165" r="8" fill="#873c44"/><circle cx="267" cy="154" r="8" fill="#873c44"/><circle cx="303" cy="164" r="8" fill="#873c44"/><circle cx="325" cy="182" r="8" fill="#873c44"/><circle cx="238" cy="194" r="8" fill="#873c44"/><circle cx="268" cy="187" r="8" fill="#873c44"/><circle cx="290" cy="209" r="8" fill="#873c44"/><circle cx="324" cy="215" r="8" fill="#873c44"/><circle cx="241" cy="226" r="8" fill="#873c44"/><circle cx="271" cy="239" r="8" fill="#873c44"/><circle cx="305" cy="242" r="8" fill="#873c44"/><circle cx="334" cy="244" r="8" fill="#873c44"/><circle cx="430" cy="146" r="8" fill="#873c44"/><circle cx="527" cy="151" r="8" fill="#873c44"/><circle cx="472" cy="211" r="8" fill="#873c44"/><circle cx="546" cy="248" r="8" fill="#873c44"/><text x="24" y="303" font-size="16" font-weight="600">Composition: lines are chemical bonds</text><rect x="24" y="327" width="170" height="184" fill="#f4e9db" stroke="#a18571"/><text x="34" y="355" font-size="15" font-weight="600">D · One substance</text><path d="M66 393H74" stroke="#514239" stroke-width="3"/><circle cx="58" cy="393" r="8" fill="#873c44"/><circle cx="82" cy="393" r="8" fill="#873c44"/><path d="M133 393H141" stroke="#514239" stroke-width="3"/><circle cx="125" cy="393" r="8" fill="#873c44"/><circle cx="149" cy="393" r="8" fill="#873c44"/><path d="M66 466H74" stroke="#514239" stroke-width="3"/><circle cx="58" cy="466" r="8" fill="#873c44"/><circle cx="82" cy="466" r="8" fill="#873c44"/><rect x="214" y="327" width="170" height="184" fill="#f4e9db" stroke="#a18571"/><text x="224" y="355" font-size="15" font-weight="600">E · One substance</text><path d="M256 393H264" stroke="#514239" stroke-width="3"/><circle cx="248" cy="393" r="8" fill="#873c44"/><rect x="264" y="385" width="16" height="16" fill="#947043"/><path d="M323 393H331" stroke="#514239" stroke-width="3"/><circle cx="315" cy="393" r="8" fill="#873c44"/><rect x="331" y="385" width="16" height="16" fill="#947043"/><path d="M256 466H264" stroke="#514239" stroke-width="3"/><c