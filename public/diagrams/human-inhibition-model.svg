<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650" role="img" aria-labelledby="title desc">
  <title id="title">A hypothetical inhibition-zone measurement</title>
  <desc id="desc">Conceptual closed-lid view, not actual culture results. A treatment disc six millimetres across sits inside a twenty millimetre clear zone. The full zone diameter includes the disc. A separate solvent control has no additional clear halo. Dots represent visible growth, not individual counted cells.</desc>
  <defs>
    <pattern id="growth" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r="1.4" fill="#725b45"/><circle cx="12" cy="12" r="1.1" fill="#725b45"/></pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#902c39"/></marker>
  </defs>
  <rect width="440" height="650" rx="10" fill="#f8f2e6"/>
  <g font-family="Georgia,serif" fill="#332b28">
    <text x="220" y="34" text-anchor="middle" font-size="23">Measure the whole clear zone</text>
    <text x="220" y="59" text-anchor="middle" font-family="sans-serif" font-size="16">Hypothetical · no experiment performed</text>
    <circle cx="220" cy="192" r="105" fill="#efe0bd" stroke="#725b45" stroke-width="2"/>
    <circle cx="220" cy="192" r="100" fill="url(#growth)"/>
    <circle cx="220" cy="192" r="60" fill="#fffaf0" stroke="#a79576" stroke-width="1.5"/>
    <circle cx="220" cy="192" r="18" fill="#c9b899" stroke="#725b45" stroke-width="1.5"/>
    <line x1="160" y1="192" x2="280" y2="192" stroke="#902c39" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="220" y="165" text-anchor="middle" font-family="sans-serif" font-size="19">20 mm</text>
    <line x1="209" y1="208" x2="187" y2="255" stroke="#725b45"/>
    <rect x="143" y="256" width="90" height="24" fill="#f8f2e6"/>
    <text x="188" y="274" text-anchor="middle" font-family="sans-serif" font-size="17">6 mm disc</text>
    <text x="220" y="324" text-anchor="middle" font-size="22">Treatment</text>
    <circle cx="220" cy="455" r="105" fill="#efe0bd" stroke="#725b45" stroke-width="2"/>
    <circle cx="220" cy="455" r="100" fill="url(#growth)"/>
    <circle cx="220" cy="455" r="18" fill="#c9b899" stroke="#725b45" stroke-width="1.5"/>
    <text x="220" y="586" text-anchor="middle" font-size="22">Matching solvent control</text>
    <text x="220" y="609" text-anchor="middle" font-family="sans-serif" font-size="16">No additional clear halo in this model</text>
    <text x="220" y="636" text-anchor="middle" font-family="sans-serif" font-size="16">Dots show growth, not counted cells.</text>
  </g>
</svg>
