<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">A hypothetical inhibition-zone measurement</title>
  <desc id="desc">Conceptual closed-lid view, not actual culture results. A treatment disc six millimetres across sits inside a twenty millimetre clear zone. The full zone diameter includes the disc. A separate solvent control has no additional clear halo. Dots represent visible growth, not individual counted cells.</desc>
  <defs>
    <pattern id="growth" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r="1.4" fill="#725b45"/><circle cx="12" cy="12" r="1.1" fill="#725b45"/></pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#902c39"/></marker>
  </defs>
  <rect width="720" height="460" rx="10" fill="#f8f2e6"/>
  <g font-family="Georgia,serif" fill="#332b28">
    <text x="32" y="38" font-size="24">Measure the whole clear zone</text>
    <text x="32" y="63" font-family="sans-serif" font-size="14">Original hypothetical model · no investigation performed</text>
    <circle cx="208" cy="221" r="122" fill="#efe0bd" stroke="#725b45" stroke-width="2"/>
    <circle cx="208" cy="221" r="117" fill="url(#growth)"/>
    <circle cx="208" cy="221" r="70" fill="#fffaf0" stroke="#a79576" stroke-width="1.5"/>
    <circle cx="208" cy="221" r="21" fill="#c9b899" stroke="#725b45" stroke-width="1.5"/>
    <line x1="138" y1="221" x2="278" y2="221" stroke="#902c39" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="208" y="186" text-anchor="middle" font-family="sans-serif" font-size="16">20 mm</text>
    <line x1="193" y1="238" x2="164" y2="284" stroke="#725b45"/>
    <text x="145" y="304" text-anchor="middle" font-family="sans-serif" font-size="14">6 mm disc</text>
    <text x="208" y="367" text-anchor="middle" font-size="19">Treatment</text>
    <circle cx="527" cy="221" r="122" fill="#efe0bd" stroke="#725b45" stroke-width="2"/>
    <circle cx="527" cy="221" r="117" fill="url(#growth)"/>
    <circle cx="527" cy="221" r="21" fill="#c9b899" stroke="#725b45" stroke-width="1.5"/>
    <text x="527" y="367" text-anchor="middle" font-size="19">Matching solvent control</text>
    <text x="527" y="391" text-anchor="middle" font-family="sans-serif" font-size="14">No additional clear halo in this model</text>
    <text x="32" y="426" font-family="sans-serif" font-size="14">Dots show visible growth, not counted cells. Zone size is not a clinical threshold.</text>
  </g>
</svg>
