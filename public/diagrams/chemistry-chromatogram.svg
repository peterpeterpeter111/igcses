<svg xmlns="http://www.w3.org/2000/svg" width="720" height="475" viewBox="0 0 720 475" role="img" aria-labelledby="title desc">
<title id="title">Measure chromatogram distances from the baseline</title>
<desc id="desc">References A and B each produce one spot. The mixture has two spots matching them. The solvent front moves 80 millimetres, A moves 20 and B moves 56. Their Rf values are 0.25 and 0.70. All distances start at the same baseline. This schematic supports a possible match, not conclusive identification.</desc>
<rect width="720" height="475" fill="#faf5ec"/>
<text x="30" y="35" font-family="Georgia,serif" font-size="25" fill="#332b29">One baseline for every measurement</text>
<rect x="30" y="60" width="440" height="300" fill="#fffdf7" stroke="#c4b4a2"/>
<path d="M45 80H455" fill="none" stroke="#8a7164" stroke-width="2" stroke-dasharray="7 4"/>
<path d="M45 320H455" fill="none" stroke="#70625c" stroke-width="2"/>
<g fill="#8a3444"><ellipse cx="105" cy="260" rx="12" ry="7"/><ellipse cx="350" cy="260" rx="12" ry="7"/></g>
<g fill="#4c6571"><ellipse cx="225" cy="152" rx="12" ry="7"/><ellipse cx="350" cy="152" rx="12" ry="7"/></g>
<g stroke="#aa9584" stroke-width="1.5" fill="none"><path d="M470 80H533M470 320H533M527 80V320M521 80H533M521 320H533M390 260V320M384 260H396M384 320H396"/></g>
<g font-family="Arial,sans-serif" fill="#473b35" font-size="18">
<text x="480" y="65">Solvent front</text><text x="480" y="348">Baseline</text>
<text x="542" y="205">80 mm</text><text x="399" y="296">20 mm</text>
<text x="105" y="386" text-anchor="middle">Reference A</text><text x="225" y="386" text-anchor="middle">Reference B</text><text x="350" y="386" text-anchor="middle">Mixture</text>
<text x="30" y="425">A: Rf = 20 / 80 = 0.25</text><text x="330" y="425">B: Rf = 56 / 80 = 0.70</text>
<text x="30" y="457" font-size="16">Same solvent and paper. Illustrative data, not an experimental measurement.</text>
</g>
</svg>
