<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="title description">
 <title id="title">Placental exchange between normally separate circulations</title>
 <desc id="description">Original functional model. Oxygen and nutrients cross placental tissues towards developing-organism blood; carbon dioxide and wastes cross towards maternal blood. Material exchange does not imply bulk blood mixing. Umbilical vein runs from placenta towards developing organism and arteries run towards placenta.</desc>
 <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#774c42"/></marker></defs>
 <rect width="1000" height="800" fill="#faf7ed"/>
 <g font-family="Arial, sans-serif" fill="#302c27">
  <text x="34" y="49" font-size="28" font-weight="bold">Exchange across placental tissues</text>
  <text x="34" y="85" font-size="18">Original functional model · not an anatomical section or measured concentration profile</text>
  <rect x="34" y="128" width="298" height="294" fill="#eee2d9" stroke="#ac8d79"/>
  <rect x="670" y="128" width="296" height="294" fill="#e4e6d5" stroke="#8b9277"/>
  <rect x="447" y="128" width="110" height="294" fill="#efe7d5" stroke="#9b8766"/>
  <text x="54" y="171" font-size="23" font-weight="bold">Maternal blood</text>
  <text x="54" y="210" font-size="19">Surrounds villi</text>
  <text x="54" y="365" font-size="19">Maternal circulation</text>
  <text x="54" y="397" font-size="19">removes received wastes</text>
  <text x="690" y="171" font-size="23" font-weight="bold">Developing blood</text>
  <text x="690" y="210" font-size="19">In villus capillaries</text>
  <text x="690" y="365" font-size="19">Embryonic / fetal</text>
  <text x="690" y="397" font-size="19">circulation</text>
  <text x="460" y="162" font-size="17">Placental</text>
  <text x="460" y="188" font-size="17">tissues</text>
  <path d="M338 262H658" stroke="#774c42" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="341" y="221" width="315" height="29" fill="#faf7ed"/>
  <text x="354" y="242" font-size="19">Oxygen + nutrients →</text>
  <path d="M658 327H340" stroke="#774c42" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="341" y="283" width="315" height="29" fill="#faf7ed"/>
  <text x="354" y="304" font-size="19">← Carbon dioxide + wastes</text>
  <text x="34" y="469" font-size="22" font-weight="bold">Material crosses; blood supplies normally remain separate.</text>
  <rect x="34" y="509" width="932" height="145" fill="#efe7d5" stroke="#9b8766"/>
  <text x="54" y="548" font-size="22" font-weight="bold">Umbilical vessel direction</text>
  <text x="54" y="589" font-size="20">Vein: placenta → developing organism (relatively oxygen / nutrient rich)</text>
  <text x="54" y="628" font-size="20">Arteries: developing organism → placenta (wastes for exchange)</text>
  <text x="34" y="705" font-size="19">Large villus area, short exchange distance and blood supply support transfer.</text>
  <text x="34" y="748" font-size="18">Different substances use different transport mechanisms; not all use simple diffusion.</text>
  <text x="34" y="783" font-size="18">The placenta is not a complete barrier to every harmful substance or infection.</text>
 </g>
</svg>
