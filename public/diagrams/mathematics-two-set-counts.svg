<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Two clubs in a class of 20</title>
  <desc id="desc">Music only has 5 students, the overlap has 3, chess only has 4, and 8 students attend neither. Music has 8 students in total and chess has 7.</desc>
  <rect width="760" height="390" fill="#faf6ee"/>
  <g font-family="Georgia,serif" fill="#30241f">
    <text x="32" y="35" font-size="23">U: all 20 students</text>
    <rect x="25" y="52" width="710" height="275" rx="2" fill="none" stroke="#6c594d" stroke-width="2"/>
    <circle cx="300" cy="188" r="108" fill="#9b3940" fill-opacity=".09" stroke="#86343c" stroke-width="2.5"/>
    <circle cx="445" cy="188" r="108" fill="#b2883c" fill-opacity=".12" stroke="#8e6c32" stroke-width="2.5"/>
    <text x="270" y="117" font-size="21" text-anchor="middle">Music</text>
    <text x="475" y="117" font-size="21" text-anchor="middle">Chess</text>
    <g font-size="34" text-anchor="middle">
      <text x="275" y="201">5</text><text x="372" y="201">3</text><text x="470" y="201">4</text>
      <text x="640" y="265">8</text>
    </g>
    <text x="640" y="291" font-size="18" text-anchor="middle">Neither</text>
    <text x="380" y="365" font-size="21" text-anchor="middle">5 + 3 + 4 + 8 = 20 students</text>
  </g>
</svg>
