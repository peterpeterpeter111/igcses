<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Electron transfer: magnesium chloride</title><desc id="desc">Two magnesium outer electrons, marked crosses, transfer one to each chlorine atom. Products have one Mg2+ and two Cl-; each chloride has seven dots and one cross.</desc><rect width="900" height="540" fill="#faf5eb"/><g font-family="Georgia,serif" fill="#322725"><text x="32" y="38" font-size="25">Electron transfer: magnesium chloride</text><text x="450" y="83" text-anchor="middle" font-size="19">Before transfer: original outer electrons</text><text x="200" y="171" text-anchor="middle" font-size="25">Cl</text><circle cx="192" cy="125" r="3.2" fill="#7e2632"/><circle cx="208" cy="125" r="3.2" fill="#7e2632"/><circle cx="239" cy="156" r="3.2" fill="#7e2632"/><circle cx="239" cy="172" r="3.2" fill="#7e2632"/><circle cx="208" cy="203" r="3.2" fill="#7e2632"/><circle cx="192" cy="203" r="3.2" fill="#7e2632"/><circle cx="161" cy="172" r="3.2" fill="#7e2632"/><text x="450" y="171" text-anchor="middle" font-size="25">Mg</text><path d="M438 121l8 8m0 -8l-8 8" fill="none" stroke="#665540" stroke-width="2"/><path d="M454 121l8 8m0 -8l-8 8" fill="none" stroke="#665540" stroke-width="2"/><text x="700" y="171" text-anchor="middle" font-size="25">Cl</text><circle cx="692" cy="125" r="3.2" fill="#7e2632"/><circle cx="708" cy="125" r="3.2" fill="#7e2632"/><circle cx="739" cy="156" r="3.2" fill="#7e2632"/><circle cx="739" cy="172" r="3.2" fill="#7e2632"/><circle cx="708" cy="203" r="3.2" fill="#7e2632"/><circle cx="692" cy="203" r="3.2" fill="#7e2632"/><circle cx="661" cy="172" r="3.2" fill="#7e2632"/><path d="M420 175Q320 245 235 185m-1 0l15 -2m-15 2l8 13M480 175Q580 245 665 185m1 0l-15 -2m15 2l-8 13" fill="none" stroke="#9a7444" stroke-width="2"/><text x="450" y="280" text-anchor="middle" font-size="19">After transfer: correct ion charges and 1 : 2 ratio</text><text x="200" y="372" text-anchor="middle" font-size="25">Cl</text><circle cx="192" cy="326" r="3.2" fill="#7e2632"/><circle cx="208" cy="326" r="3.2" fill="#7e2632"/><circle cx="239" cy="357" r="3.2" fill="#7e2632"/><circle cx="239" cy="373" r="3.2" fill="#7e2632"/><circle cx="208" cy="404" r="3.2" fill="#7e2632"/><circle cx="192" cy="404" r="3.2" fill="#7e2632"/><circle cx="161" cy="373" r="3.2" fill="#7e2632"/><path d="M157 353l8 8m0 -8l-8 8" fill="none" stroke="#665540" stroke-width="2"/><path d="M145 312h-8v106h8m110 -106h8v106h-8" fill="none" stroke="#322725" stroke-width="2"/><text x="275" y="317" text-anchor="middle" font-size="20">−</text><text x="450" y="372" text-anchor="middle" font-size="25">Mg</text><path d="M395 312h-8v106h8m110 -106h8v106h-8" fill="none" stroke="#322725" stroke-width="2"/><text x="525" y="317" text-anchor="middle" font-size="20">2+</text><text x="700" y="372" text-anchor="middle" font-size="25">Cl</text><circle cx="692" cy="326" r="3.2" fill="#7e2632"/><circle cx="708" cy="326" r="3.2" fill="#7e2632"/><circle cx="739" cy="357" r="3.2" fill="#7e2632"/><circle cx="739" cy="373" r="3.2" fill="#7e2632"/><circle cx="708" cy="404" r="3.2" fill="#7e2632"/><circle cx="692" cy="404" r="3.2" fill="#7e2632"/><circle cx="661" cy="373" r="3.2" fill="#7e2632"/><path d="M657 353l8 8m0 -8l-8 8" fill="none" stroke="#665540" stroke-width="2"/><path d="M645 312h-8v106h8m110 -106h8v106h-8" fill="none" stroke="#322725" stroke-width="2"/><text x="775" y="317" text-anchor="middle" font-size="20">−</text><text x="450" y="465" text-anchor="middle" font-size="17">Dots: chlorine electrons · Crosses: magnesium electrons</text><text x="450" y="499" text-anchor="middle" font-size="16">Mg²⁺ still has ten inner electrons; only the original outer electrons are shown.</text></g></svg>
