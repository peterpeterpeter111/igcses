<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" role="img" aria-labelledby="title desc"><title id="title">Tooth layers</title><desc id="desc">Original simplified tooth section showing crown enamel, dentine around the pulp, blood-vessel and nerve route, gum level and root cementum/support.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8c2635"/></marker></defs><rect width="960" height="730" fill="#f7f0e4"/><g font-family="Arial,sans-serif" fill="#2e2724"><text x="35" y="40" font-size="25">Tooth layers and support</text><text x="35" y="73" font-size="17">Simplified longitudinal section; shapes and layer thicknesses are schematic.</text><path d="M165 370 C130 280 115 155 175 138 C220 125 238 154 267 154 C292 154 320 125 365 139 C425 157 408 280 375 370 L348 608 Q320 641 292 492 L268 418 L246 492 Q214 641 190 608Z" fill="#e9d4ad" stroke="#9c733d" stroke-width="6"/><path d="M165 370 C130 280 115 155 175 138 C220 125 238 154 267 154 C292 154 320 125 365 139 C425 157 408 280 375 370 L350 326 Q340 218 294 221 Q265 237 238 221 Q192 218 188 326Z" fill="#fdf9f0" stroke="#8c2635" stroke-width="2"/><path d="M213 341 Q216 256 256 272 Q265 281 280 272 Q320 256 322 341 L300 390 L286 482 L274 394 L251 390 L234 480 L226 390Z" fill="#c78483" stroke="#8c2635" stroke-width="2"/><path d="M270 388 V450 M270 410 L236 552 M270 410 L311 552" stroke="#8c2635" stroke-width="5" fill="none"/><path d="M93 380 H447" stroke="#b99283" stroke-width="18"/><text x="64" y="357" font-size="17">Gum</text><path d="M392 206 H520" stroke="#51463f"/><text x="535" y="211" font-size="20">Enamel covers the crown</text><path d="M338 358 L470 292 H520" fill="none" stroke="#51463f"/><text x="535" y="297" font-size="20">Dentine beneath enamel</text><path d="M287 306 L475 365 H520" fill="none" stroke="#51463f"/><text x="535" y="370" font-size="20">Pulp: nerves and blood vessels</text><path d="M356 541 H520" stroke="#51463f"/><text x="535" y="545" font-size="20">Root surface has cementum</text><text x="535" y="575" font-size="17">Supporting tissue anchors root in socket</text><text x="75" y="676" font-size="18">Crown lies above the gum; root extends into the supporting socket.</text></g></svg>
