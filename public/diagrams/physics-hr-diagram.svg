<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">Principal regions of an H–R diagram</title>
<desc id="desc">Luminosity increases upwards. Surface temperature decreases to the right. The main sequence runs from hot bright upper left to cool faint lower right. Red giants occupy the upper right, white dwarfs the lower left, and supergiants the upper region.</desc>
<defs><marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#473b35"/></marker></defs>
<rect width="760" height="560" rx="4" fill="#faf5ec"/>
<text x="32" y="38" font-family="Georgia,serif" font-size="24" fill="#332b29">Hertzsprung–Russell diagram</text>
<g fill="none" stroke="#473b35" stroke-width="2" marker-end="url(#axis)"><path d="M100 447V85"/><path d="M100 447H703"/></g>
<g font-family="Arial,sans-serif" font-size="18" fill="#473b35">
<text x="41" y="310" transform="rotate(-90 41 310)">Luminosity increases</text>
<text x="112" y="479">Hotter · bluer</text><text x="557" y="479">Cooler · redder</text>
<text x="193" y="514">Surface temperature decreases to the right</text>
</g>
<path d="M165 155C230 220 275 263 346 309S497 386 570 411" fill="none" stroke="#812e3c" stroke-width="29" opacity="0.18"/>
<path d="M165 155C230 220 275 263 346 309S497 386 570 411" fill="none" stroke="#812e3c" stroke-width="2" stroke-dasharray="5 4"/>
<ellipse cx="552" cy="222" rx="110" ry="52" fill="#9b7141" fill-opacity="0.12" stroke="#9b7141" stroke-width="1.5"/>
<ellipse cx="262" cy="384" rx="107" ry="35" fill="#536c75" fill-opacity="0.10" stroke="#536c75" stroke-width="1.5"/>
<rect x="303" y="89" width="365" height="49" rx="8" fill="#9b7141" fill-opacity="0.12" stroke="#9b7141" stroke-width="1.5"/>
<g font-family="Arial,sans-serif" font-size="20" fill="#332b29">
<text x="426" y="120">Supergiants</text><text x="505" y="228">Red giants</text>
<text x="200" y="391">White dwarfs</text>
<text x="308" y="277">Main sequence</text>
</g>
<g font-family="Arial,sans-serif" font-size="16" fill="#473b35"><text x="32" y="546">Original schematic · no numerical scales or measured stars · not an evolution track</text></g>
</svg>
