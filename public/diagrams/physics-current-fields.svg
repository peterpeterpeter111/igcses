<svg xmlns="http://www.w3.org/2000/svg" width="720" height="880" viewBox="0 0 720 880" role="img" aria-labelledby="title desc">
<title id="title">Fields around a wire, a flat coil and a solenoid</title>
<desc id="desc">Crimson arrows show the magnetic field. A dot denotes conventional current out of the page and a cross into the page. Wire current out of the page gives counterclockwise field. In side views of the coil and solenoid, current out above and in below gives internal field to the right with external return loops.</desc>
<defs><marker id="field" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#812e3c"/></marker></defs>
