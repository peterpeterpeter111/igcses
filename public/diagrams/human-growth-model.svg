<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 630" role="img" aria-labelledby="title description">
 <title id="title">Invented human height curve for rate interpretation</title>
 <desc id="description">Original fictional points: ages zero, two, eight, twelve, sixteen and twenty years; heights fifty, eighty-five, one hundred twenty, one hundred thirty-eight, one hundred seventy and one hundred seventy-four centimetres. Height is on the vertical axis and age on the horizontal. Intervals have different gradients. This is not a clinical standard or measured person's data.</desc>
 <rect width="720" height="630" fill="#faf7ed"/>
 <g font-family="Arial, sans-serif" fill="#302c27">
  <text x="30" y="40" font-size="26" font-weight="bold">Size versus growth rate</text>
  <text x="30" y="74" font-size="20">Original invented values · not a clinical reference</text>
  <g stroke="#d7cebc" stroke-width="1">
   <path d="M90 90H630M90 190H630M90 290H630M90 390H630"/>
  </g>
  <path d="M90 90V490H630" fill="none" stroke="#6b5a45" stroke-width="2"/>
  <g font-size="19" text-anchor="end">
   <text x="78" y="97">200</text><text x="78" y="197">150</text><text x="78" y="297">100</text><text x="78" y="397">50</text><text x="78" y="497">0</text>
  </g>
  <text x="25" y="332" font-size="20" transform="rotate(-90 25 332)">Height / cm</text>
  <g stroke="#6b5a45" stroke-width="2"><path d="M90 490V499M142 490V499M298 490V499M402 490V499M506 490V499M610 490V499"/></g>
  <g font-size="19" text-anchor="middle"><text x="90" y="525">0</text><text x="142" y="525">2</text><text x="298" y="525">8</text><text x="402" y="525">12</text><text x="506" y="525">16</text><text x="610" y="525">20</text></g>
  <text x="303" y="560" font-size="20">Age / years</text>
  <path d="M90 390L142 320L298 250L402 214L506 150L610 142" fill="none" stroke="#873d39" stroke-width="4"/>
  <g fill="#873d39"><circle cx="90" cy="390" r="5"/><circle cx="142" cy="320" r="5"/><circle cx="298" cy="250" r="5"/><circle cx="402" cy="214" r="5"/><circle cx="506" cy="150" r="5"/><circle cx="610" cy="142" r="5"/></g>
  <g font-size="19" text-anchor="middle"><text x="106" y="369">50</text><text x="158" y="303">85</text><text x="298" y="232">120</text><text x="402" y="196">138</text><text x="506" y="129">170</text><text x="610" y="121">174</text></g>
  <text x="30" y="603" font-size="19">Joined points show interval trends, not continuous measurements.</text>
 </g>
</svg>
