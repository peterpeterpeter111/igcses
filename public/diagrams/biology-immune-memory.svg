<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc">
<title id="title">First and memory antibody responses on a shared elapsed-time scale</title>
<desc id="desc">Original conceptual curves, not measured data. Each response is compared from its own exposure to the same antigen. The memory response has a shorter delay, a steeper rise and a higher peak than the first response. Baseline levels and shapes are simplified; actual responses vary.</desc>
<defs><marker id="axis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6b6257" stroke-width="1.4"/></marker></defs>
<rect width="1000" height="670" fill="#fbf8f0"/>
<g font-family="system-ui, sans-serif" fill="#292524">
<text x="34" y="43" font-size="26" font-weight="650">Immune memory: compare each response from exposure</text>
<text x="34" y="75" font-size="16" fill="#686158">Original conceptual curves · no measured values or clinical prediction</text>
<path d="M95 480V112M95 480H938" fill="none" stroke="#6b6257" stroke-width="2" marker-end="url(#axis)"/>
<text transform="translate(45 420) rotate(-90)" font-size="18">Relative antibody amount</text>
<text x="512" y="519" font-size="18">Elapsed time after each exposure →</text>
<path d="M95 480H230C267 480 278 458 316 424C353 389 394 354 458 350C526 345 552 386 615 417C690 453 755 470 846 477" fill="none" stroke="#75604c" stroke-width="4"/>
<path d="M95 480H140C172 480 178 416 201 308C222 207 254 159 317 159C401 158 434 208 504 268C612 361 715 404 846 427" fill="none" stroke="#963d43" stroke-width="4"/>
<path d="M95 480V535" stroke="#8b8175" stroke-width="1.5"/>
<text x="91" y="561" font-size="17">Exposure: start each clock here</text>
<path d="M638 141H690" stroke="#963d43" stroke-width="4"/>
<text x="705" y="147" font-size="18" font-weight="600">Memory response</text>
<text x="705" y="171" font-size="15">to the same antigen</text>
<path d="M638 198H690" stroke="#75604c" stroke-width="4"/>
<text x="705" y="204" font-size="18" font-weight="600">First response</text>
<text x="285" y="137" font-size="17" fill="#963d43">Higher peak</text>
<text x="463" y="332" font-size="17" fill="#75604c">Lower peak</text>
<text x="95" y="608" font-size="18" font-weight="600">Begins sooner</text>
<text x="95" y="634" font-size="16">Shorter delay after exposure</text>
<text x="397" y="608" font-size="18" font-weight="600">Rises faster</text>
<text x="397" y="634" font-size="16">Steeper rising curve</text>
<text x="677" y="608" font-size="18" font-weight="600">Greater amount</text>
<text x="677" y="634" font-size="16">Higher peak in this comparison</text>
</g></svg>
