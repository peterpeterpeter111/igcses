<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
<title id="title">A schematic melting curve</title>
<desc id="desc">Temperature rises as a solid warms, stays constant during melting while energy is supplied, then rises as the liquid warms. Phase durations and slopes are schematic, not measured data.</desc>
<rect width="800" height="440" rx="4" fill="#faf5ec"/>
<g fill="#332b29" font-family="Georgia,serif">
<text x="46" y="38" font-size="23">Heating through a change of state</text>
<text x="46" y="65" font-size="15">Pure substance • fixed pressure • schematic, not measured data</text>
</g>
<g stroke="#76685d" stroke-width="2" fill="none">
<path d="M110 110V345H730"/>
<path d="M105 118L110 108L115 118M721 340L731 345L721 350"/>
<path d="M110 235H650" stroke-dasharray="5 6" stroke="#b4a18b"/>
</g>
<g fill="#473b35" font-family="Arial,sans-serif" font-size="16">
<text x="113" y="100">Temperature</text>
<text x="573" y="377">Time (schematic)</text>
<text x="18" y="226">Melting</text><text x="18" y="247">temperature</text>
</g>
<path d="M135 319L280 235H525L682 137" fill="none" stroke="#812e3c" stroke-width="5" stroke-linejoin="round"/>
<g fill="#812e3c"><circle cx="280" cy="235" r="5"/><circle cx="525" cy="235" r="5"/></g>
<g fill="#473b35" font-family="Arial,sans-serif" font-size="17">
<text x="124" y="255">Solid warms</text>
<text x="298" y="207">Solid + liquid: melting</text>
<text x="538" y="123">Liquid warms</text>
<text x="268" y="277">Energy still enters during the flat region</text>
<text x="46" y="414" font-size="15">No quantitative heating rate, phase duration or experimental result is implied.</text>
</g>
</svg>
