<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Shared and non-bonding pairs</title><desc id="desc">Water has two O-H shared pairs and two lone pairs on oxygen, eight outer electrons total. Carbon dioxide has two C=O double bonds and two lone pairs on each oxygen, sixteen total.</desc><rect width="900" height="450" fill="#faf5eb"/><g font-family="Georgia,serif" fill="#322725"><text x="32" y="38" font-size="25">Shared and non-bonding pairs</text><text x="225" y="100" text-anchor="middle" font-size="22">Water: H₂O</text><text x="670" y="100" text-anchor="middle" font-size="22">Carbon dioxide: CO₂</text><text x="105" y="210" text-anchor="middle" font-size="25">H</text><text x="225" y="210" text-anchor="middle" font-size="25">O</text><text x="345" y="210" text-anchor="middle" font-size="25">H</text><circle cx="159" cy="203" r="3.2" fill="#7e2632"/><path d="M167 199l8 8m0 -8l-8 8" fill="none" stroke="#665540" stroke-width="2"/><circle cx="279" cy="203" r="3.2" fill="#7e2632"/><path d="M287 199l8 8m0 -8l-8 8" fill="none" stroke="#665540" stroke-width="2"/><circle cx="218" cy="144" r="3.2" fill="#7e2632"/><circle cx="232" cy="144" r="3.2" fill="#7e2632"/><circle cx="218" cy="262" r="3.2" fill="#7e2632"/><circle cx="232" cy="262" r="3.2" fill="#7e2632"/><text x="550" y="210" text-anchor="middle" font-size="25">O</text><text x="670" y="210" text-anchor="middle" font-size="25">C</text><text x="790" y="210" text-anchor="middle" font-size="25">O</text><circle cx="604" cy="189" r="3.2" fill="#7e2632"/><path d="M612 185l8 8m0 -8l-8 8" fill="none" stroke="#665540" stroke-width="2"/><circle cx="604" cy="217" r="3.2" fill="#7e2632"/><path d="M612 213l8 8m0 -8l-8 8" fill="none" stroke="#665540" stroke-width="2"/><circle cx="724" cy="189" r="3.2" fill="#7e2632"/><path d="M732 185l8 8m0 -8l-8 8" fill="none" stroke="#665540" stroke-width="2"/><circle cx="724" cy="217" r="3.2" fill="#7e2632"/><path d="M732 213l8 8m0 -8l-8 8" fill="none" stroke="#665540" stroke-width="2"/><circle cx="543" cy="144" r="3.2" fill="#7e2632"/><circle cx="557" cy="144" r="3.2" fill="#7e2632"/><circle cx="543" cy="262" r="3.2" fill="#7e2632"/><circle cx="557" cy="262" r="3.2" fill="#7e2632"/><circle cx="783" cy="144" r="3.2" fill="#7e2632"/><circle cx="797" cy="144" r="3.2" fill="#7e2632"/><circle cx="783" cy="262" r="3.2" fill="#7e2632"/><circle cx="797" cy="262" r="3.2" fill="#7e2632"/><text x="225" y="321" text-anchor="middle" font-size="18">2 shared pairs + 2 lone pairs</text><text x="670" y="321" text-anchor="middle" font-size="18">4 shared pairs + 4 lone pairs</text><text x="450" y="378" text-anchor="middle" font-size="18">Dots: oxygen · Crosses: hydrogen or carbon</text><text x="450" y="413" text-anchor="middle" font-size="17">Count each shared electron once in the molecule’s total.</text></g></svg>
