<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
 <title id="title">Unequal class widths in a histogram</title><desc id="desc">Classes zero to four, four to ten and ten to twenty have frequency densities two, one point five and zero point three. Areas correspond to frequencies eight, nine and three.</desc>
 <rect width="900" height="450" fill="#faf5ec"/>
 <g font-family="Georgia, serif" fill="#332722"><text x="34" y="34" font-size="24">Frequency is the bar area</text><text x="34" y="61" font-size="16">Density = frequency ÷ class width</text></g>
 <g stroke="#e0d3bf" stroke-width="1"><path d="M100 95 H800 M100 220 H800 M100 345 H800"/></g>
 <g stroke="#6e3535" stroke-width="2"><rect x="100" y="95" width="140" height="250" fill="#cd8d82"/><rect x="240" y="157.5" width="210" height="187.5" fill="#d6ae80"/><rect x="450" y="307.5" width="350" height="37.5" fill="#b8aa90"/></g>
 <path d="M100 83 V345 H810" fill="none" stroke="#332722" stroke-width="2"/>
 <g font-family="Georgia, serif" font-size="18" fill="#332722"><text x="78" y="351">0</text><text x="78" y="226">1</text><text x="78" y="101">2</text><text x="95" y="374">0</text><text x="235" y="374">4</text><text x="440" y="374">10</text><text x="790" y="374">20</text><text x="40" y="263" transform="rotate(-90 40 263)">Frequency density</text><text x="500" y="411">Measurement x</text><text x="147" y="245">f = 8</text><text x="312" y="245">f = 9</text><text x="587" y="332">f = 3</text></g>
</svg>
