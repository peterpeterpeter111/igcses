<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">Human nuclear gene information moves by mRNA to a ribosome</title><desc id="desc">Nucleus contains DNA template aligned three prime TAC CGA CTA five prime, producing mRNA five prime AUG GCU GAU three prime. mRNA crosses to cytoplasm. At the ribosome complementary tRNA anticodons deliver methionine alanine and aspartate into that ordered chain. DNA remains in the nucleus.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c2935"/></marker></defs>
<rect width="900" height="460" fill="#fffaf2"/><g font-family="Arial,sans-serif" fill="#302623">
<text x="24" y="34" font-size="23" font-weight="bold">Transcription → mRNA transfer → translation</text>
<rect x="25" y="66" width="395" height="270" rx="10" fill="#f5e9dc" stroke="#8c2935" stroke-width="2"/><text x="45" y="100" font-size="22" font-weight="bold">Nucleus</text>
<text x="45" y="137" font-size="17">DNA coding: 5′ ATG GCT GAT 3′</text><text x="45" y="168" font-size="17">DNA template: 3′ TAC CGA CTA 5′</text>
<path d="M220 186V226" fill="none" stroke="#8c2935" stroke-width="3" marker-end="url(#arrow)"/><text x="240" y="208" font-size="16">Transcription</text>
<text x="45" y="259" font-size="18">mRNA: 5′ AUG GCU GAU 3′</text><text x="45" y="309" font-size="17">DNA stays in the nucleus.</text>
<path d="M420 255H476" stroke="#8c2935" stroke-width="3" marker-end="url(#arrow)"/><text x="423" y="220" font-size="14">Transfer</text>
<rect x="490" y="66" width="385" height="270" rx="10" fill="#f5eddc" stroke="#a2773b" stroke-width="2"/><text x="510" y="100" font-size="22" font-weight="bold">Cytoplasm</text>
<text x="510" y="139" font-size="17">At a ribosome:</text><text x="510" y="173" font-size="18">mRNA: 5′ AUG GCU GAU 3′</text><text x="510" y="206" font-size="16">tRNA:  3′ UAC CGA CUA 5′</text><text x="510" y="233" font-size="15">Anticodons shown directly opposite codons.</text>
<path d="M678 244V274" stroke="#8c2935" stroke-width="3" marker-end="url(#arrow)"/><text x="510" y="310" font-size="18">Chain: methionine–alanine–aspartate</text>
<text x="30" y="370" font-size="17">tRNA carries amino acids; the ribosome links them in the specified order.</text>
<text x="30" y="402" font-size="17">Code key: AUG → methionine; GCU → alanine; GAU → aspartate.</text>
<text x="30" y="436" font-size="16">Original simplified model of a short gene fragment, not a full cell, micrograph or complete protein.</text>
</g></svg>
