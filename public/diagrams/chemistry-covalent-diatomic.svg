<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1040" viewBox="0 0 600 1040" role="img" aria-labelledby="title desc"><title id="title">Original diatomic shared-electron models</title><desc id="desc">Each panel shows outer-electron pairs and an explicit original-atom key; layouts do not specify molecular shapes.</desc><rect width="600" height="1040" fill="#faf7ef"/><g font-family="Arial,sans-serif" fill="#352b25">
<text x="25" y="30" font-size="22" font-weight="700">Shared pairs and lone pairs</text>
<text x="25" y="57" font-size="17">Outer-electron bookkeeping, not molecular shapes.</text>
<g data-molecule="H2" transform="translate(0,80)"><path d="M20 0H580" stroke="#c5b7a9"/><text x="25" y="27" font-size="20" font-weight="700">Hydrogen · H₂ · 2 electrons</text>
<text data-atom="H1" data-element="H" x="200" y="152" text-anchor="middle" font-size="23">H</text>
<text data-atom="H2" data-element="H" x="400" y="152" text-anchor="middle" font-size="23">H</text>
<circle data-owner="H1" data-electron="dot" data-kind="bond" data-edge="H1-H2" cx="295.000" cy="145.000" r="3.5" fill="#8c4c3f"/>
<path data-owner="H2" data-electron="cross" data-kind="bond" data-edge="H1-H2" d="M301.000 141.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<text x="25" y="278" font-size="17">• left H · × right H</text>
</g>
<g data-molecule="O2" transform="translate(0,400)"><path d="M20 0H580" stroke="#c5b7a9"/><text x="25" y="27" font-size="20" font-weight="700">Oxygen · O₂ · 12 electrons</text>
<text data-atom="O1" data-element="O" x="200" y="152" text-anchor="middle" font-size="23">O</text>
<text data-atom="O2" data-element="O" x="400" y="152" text-anchor="middle" font-size="23">O</text>
<circle data-owner="O1" data-electron="dot" data-kind="bond" data-edge="O1-O2" cx="295.000" cy="136.000" r="3.5" fill="#8c4c3f"/>
<path data-owner="O2" data-electron="cross" data-kind="bond" data-edge="O1-O2" d="M301.000 132.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<circle data-owner="O1" data-electron="dot" data-kind="bond" data-edge="O1-O2" cx="295.000" cy="154.000" r="3.5" fill="#8c4c3f"/>
<path data-owner="O2" data-electron="cross" data-kind="bond" data-edge="O1-O2" d="M301.000 150.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<circle data-owner="O1" data-electron="dot" data-kind="lone" cx="193.000" cy="110.000" r="3.5" fill="#8c4c3f"/>
<circle data-owner="O1" data-electron="dot" data-kind="lone" cx="207.000" cy="110.000" r="3.5" fill="#8c4c3f"/>
<circle data-owner="O1" data-electron="dot" data-kind="lone" cx="193.000" cy="180.000" r="3.5" fill="#8c4c3f"/>
<circle data-owner="O1" data-electron="dot" data-kind="lone" cx="207.000" cy="180.000" r="3.5" fill="#8c4c3f"/>
<path data-owner="O2" data-electron="cross" data-kind="lone" d="M389.000 106.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<path data-owner="O2" data-electron="cross" data-kind="lone" d="M403.000 106.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<path data-owner="O2" data-electron="cross" data-kind="lone" d="M389.000 176.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<path data-owner="O2" data-electron="cross" data-kind="lone" d="M403.000 176.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<text x="25" y="278" font-size="17">• left O · × right O</text>
</g>
<g data-molecule="N2" transform="translate(0,720)"><path d="M20 0H580" stroke="#c5b7a9"/><text x="25" y="27" font-size="20" font-weight="700">Nitrogen · N₂ · 10 electrons</text>
<text data-atom="N1" data-element="N" x="200" y="152" text-anchor="middle" font-size="23">N</text>
<text data-atom="N2" data-element="N" x="400" y="152" text-anchor="middle" font-size="23">N</text>
<circle data-owner="N1" data-electron="dot" data-kind="bond" data-edge="N1-N2" cx="295.000" cy="127.000" r="3.5" fill="#8c4c3f"/>
<path data-owner="N2" data-electron="cross" data-kind="bond" data-edge="N1-N2" d="M301.000 123.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<circle data-owner="N1" data-electron="dot" data-kind="bond" data-edge="N1-N2" cx="295.000" cy="145.000" r="3.5" fill="#8c4c3f"/>
<path data-owner="N2" data-electron="cross" data-kind="bond" data-edge="N1-N2" d="M301.000 141.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<circle data-owner="N1" data-electron="dot" data-kind="bond" data-edge="N1-N2" cx="295.000" cy="163.000" r="3.5" fill="#8c4c3f"/>
<path data-owner="N2" data-electron="cross" data-kind="bond" data-edge="N1-N2" d="M301.000 159.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<circle data-owner="N1" data-electron="dot" data-kind="lone" cx="193.000" cy="110.000" r="3.5" fill="#8c4c3f"/>
<circle data-owner="N1" data-electron="dot" data-kind="lone" cx="207.000" cy="110.000" r="3.5" fill="#8c4c3f"/>
<path data-owner="N2" data-electron="cross" data-kind="lone" d="M389.000 106.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<path data-owner="N2" data-electron="cross" data-kind="lone" d="M403.000 106.000l8 8m-8 0l8 -8" stroke="#574333" stroke-width="2"/>
<text x="25" y="278" font-size="17">• left N · × right N</text>
</g>
</g></svg>
