<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc"><title id="title">Tangent at two seconds</title><desc id="desc">Crimson velocity curve passes through (0,0), (1,0.5), (2,2), (3,4.5), (4,8). Amber tangent at (2,2) passes through (1,0) and (4,6); a dashed triangle shows its rise and run.</desc><rect width="600" height="380" fill="#fffdf7"/><g font-family="Arial,sans-serif" font-size="16" fill="#252621"><path d="M80 56 V308" stroke="#ddd7cc"/><text x="80" y="331" text-anchor="middle">0</text><path d="M190 56 V308" stroke="#ddd7cc"/><text x="190" y="331" text-anchor="middle">1</text><path d="M300 56 V308" stroke="#ddd7cc"/><text x="300" y="331" text-anchor="middle">2</text><path d="M410 56 V308" stroke="#ddd7cc"/><text x="410" y="331" text-anchor="middle">3</text><path d="M520 56 V308" stroke="#ddd7cc"/><text x="520" y="331" text-anchor="middle">4</text><path d="M80 308 H520" stroke="#ddd7cc"/><text x="64" y="313" text-anchor="end">0</text><path d="M80 252 H520" stroke="#ddd7cc"/><text x="64" y="257" text-anchor="end">2</text><path d="M80 196 H520" stroke="#ddd7cc"/><text x="64" y="201" text-anchor="end">4</text><path d="M80 140 H520" stroke="#ddd7cc"/><text x="64" y="145" text-anchor="end">6</text><path d="M80 84 H520" stroke="#ddd7cc"/><text x="64" y="89" text-anchor="end">8</text><path d="M190 308 L520 140" fill="none" stroke="#946719" stroke-width="3"/><path d="M190 308 H520 V140" fill="none" stroke="#946719" stroke-width="2" stroke-dasharray="6 5"/><circle cx="300" cy="252" r="5" fill="#946719"/><text x="250" y="215" fill="#795516">Tangent at 2 s</text><path d="M 80 308 Q 300 308 520 84" fill="none" stroke="#7b2e35" stroke-width="3"/><path d="M80 46 V308 H532" fill="none" stroke="#252621" stroke-width="2"/><text x="80" y="29">Velocity / (m/s)</text><text x="300" y="364" text-anchor="middle">Time / s</text></g></svg>
